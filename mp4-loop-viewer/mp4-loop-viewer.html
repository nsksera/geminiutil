<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MP4 Loop Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050607;
      --panel: #111418;
      --panel-2: #171b20;
      --line: #303741;
      --line-strong: #6aa6ff;
      --text: #f3f5f7;
      --muted: #a6afb9;
      --danger: #ff7777;
      --ok: #88d498;
      --shadow: 0 18px 48px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      letter-spacing: 0;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #202832;
      color: var(--text);
      min-height: 36px;
      padding: 0 14px;
      cursor: pointer;
    }

    button:hover {
      border-color: #7a8798;
      background: #27313d;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(255,255,255,.035), transparent 36%),
        var(--bg);
    }

    .sidebar {
      height: 100vh;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: rgba(11, 14, 18, .96);
      padding: 18px;
    }

    .stage {
      position: relative;
      min-width: 0;
      height: 100vh;
      display: block;
      overflow: hidden;
      background: #000;
    }

    .stage:fullscreen {
      width: 100vw;
      height: 100vh;
    }

    .video-wrap {
      position: absolute;
      inset: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.04), transparent 50%),
        #000;
    }

    .video-wrap.rotating {
      cursor: grabbing;
    }

    video#player {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 22px;
      font-weight: 650;
    }

    .overlay {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: grid;
      gap: 10px;
      opacity: 1;
      transition: opacity .18s ease;
      pointer-events: auto;
    }

    .overlay.hidden,
    .overlay.idle {
      opacity: 0;
      pointer-events: none;
    }

    .nowbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 8px;
      background: rgba(8, 10, 13, .72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .nowbar .main {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .nowbar .sub {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .overlay-cards {
      display: grid;
      grid-template-columns: repeat(9, minmax(92px, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
    }

    .lead {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .section {
      display: grid;
      gap: 10px;
      padding: 14px 0;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .file-input {
      width: 100%;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hidden-input {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.error {
      color: var(--danger);
    }

    .file-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .file-row {
      display: grid;
      grid-template-columns: 30px 68px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 78px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .num {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #252d36;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
    }

    .file-meta {
      min-width: 0;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .file-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .remove-file {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: 6px;
      color: #ffc2c2;
      background: #2a1719;
      border-color: #5d2b31;
      font-size: 18px;
      line-height: 1;
    }

    .remove-file:hover {
      color: #fff;
      background: #492126;
      border-color: #a64c57;
    }

    .remove-cut,
    .redetect {
      display: grid;
      place-items: center;
      height: 32px;
      min-height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      font-size: 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,.18);
      cursor: pointer;
      white-space: nowrap;
    }

    .remove-cut {
      color: #ffd9a8;
    }

    .remove-cut:hover {
      color: #fff;
      background: #4a341f;
      border-color: #a67c4c;
    }

    .redetect {
      color: #bcd7ff;
    }

    .redetect:hover {
      color: #fff;
      background: #22354f;
      border-color: #4c74a6;
    }

    .thumb {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 6px;
      background: #222;
      border: 1px solid rgba(255,255,255,.12);
      flex: 0 0 auto;
    }

    .thumb-fallback {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.12);
      background: #1d2229;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 5px;
      overflow: hidden;
    }

    .sheet {
      grid-column: 1 / -1;
      display: block;
      width: 100%;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.12);
      cursor: zoom-in;
      background: #e9e9e9;
    }

    .sheet-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, .88);
      cursor: zoom-out;
    }

    .sheet-modal[hidden] {
      display: none;
    }

    .sheet-modal figure {
      margin: 0;
      display: grid;
      gap: 10px;
      justify-items: center;
      max-width: 94vw;
      max-height: 94vh;
    }

    .sheet-modal img {
      max-width: 94vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    .sheet-modal figcaption {
      color: var(--text);
      font-size: 14px;
    }

    .sheet-modal-hint {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .picker {
      position: fixed;
      inset: 0;
      z-index: 55;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: rgba(5, 6, 7, .97);
      padding: 18px;
      gap: 14px;
    }

    .picker[hidden] {
      display: none;
    }

    .picker-head,
    .picker-foot {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .picker-head .title {
      font-size: 18px;
      font-weight: 700;
      margin-right: auto;
    }

    .picker-grid {
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
      align-content: start;
      padding-right: 4px;
    }

    .pick-card {
      position: relative;
      display: grid;
      gap: 7px;
      padding: 8px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      cursor: pointer;
      text-align: left;
      color: var(--text);
    }

    .pick-card.selected {
      border-color: var(--line-strong);
      background: #142133;
    }

    .pick-card .sheet {
      cursor: pointer;
    }

    .pick-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .pick-note {
      color: var(--muted);
      font-size: 12px;
    }

    .pick-order {
      position: absolute;
      top: 12px;
      left: 12px;
      display: grid;
      place-items: center;
      min-width: 30px;
      height: 30px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--line-strong);
      color: #06121f;
      font-weight: 800;
      font-size: 15px;
      box-shadow: var(--shadow);
    }

    .pick-expand {
      justify-self: end;
      min-height: 28px;
      padding: 0 10px;
      font-size: 12px;
    }

    .loop-editors {
      display: grid;
      gap: 7px;
    }

    .loop-edit-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .loop-edit-row label {
      color: var(--muted);
      font-size: 13px;
    }

    .loop-edit-row input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #080a0d;
      color: var(--text);
      padding: 0 10px;
    }

    .loop-edit-row input:focus {
      outline: 2px solid rgba(106,166,255,.28);
      border-color: var(--line-strong);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .loop-card {
      position: relative;
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 9px;
      min-height: 86px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
    }

    .loop-card:hover {
      border-color: #778390;
      background: var(--panel-2);
    }

    .loop-card.active {
      border-color: var(--line-strong);
      background: #142133;
      box-shadow: 0 0 0 1px rgba(106,166,255,.2) inset;
    }

    .loop-card.disabled {
      opacity: .42;
      cursor: not-allowed;
    }

    .loop-card.compact {
      grid-template-columns: 48px minmax(0, 1fr);
      min-height: 70px;
      padding: 7px;
      background: rgba(13, 16, 21, .82);
      backdrop-filter: blur(10px);
    }

    .loop-card.compact .thumb,
    .loop-card.compact .thumb-fallback,
    .loop-card.compact .thumb-stack {
      width: 48px;
      height: 48px;
    }

    .loop-card.compact .mini-thumb {
      width: 32px;
      height: 32px;
    }

    .thumb-stack {
      position: relative;
      width: 68px;
      height: 68px;
      overflow: hidden;
      border-radius: 6px;
      background: #171b20;
    }

    .mini-thumb {
      position: absolute;
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,.18);
      background: #222;
      box-shadow: 0 5px 14px rgba(0,0,0,.35);
    }

    .mini-fallback {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
    }

    .mini-thumb:nth-child(1) { left: 0; top: 0; z-index: 4; }
    .mini-thumb:nth-child(2) { left: 12px; top: 8px; z-index: 3; }
    .mini-thumb:nth-child(3) { left: 23px; top: 16px; z-index: 2; }
    .mini-thumb:nth-child(4) { left: 8px; top: 25px; z-index: 1; }

    .loop-info {
      min-width: 0;
      display: grid;
      gap: 4px;
      align-content: center;
    }

    .loop-key {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .loop-spec {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 700;
    }

    .loop-steps {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .loop-state {
      color: var(--ok);
      font-size: 12px;
    }

    .disabled .loop-state {
      color: var(--danger);
    }

    .drop-target {
      outline: 2px solid var(--line-strong);
      outline-offset: -8px;
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 360px minmax(0, 1fr);
      }

      .overlay-cards {
        grid-template-columns: repeat(5, minmax(92px, 1fr));
      }
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }

      .app {
        display: block;
      }

      .sidebar {
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .stage {
        height: 70vh;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .overlay-cards {
        grid-template-columns: repeat(3, minmax(92px, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <aside class="sidebar">
      <h1>MP4 Loop Viewer</h1>
      <p class="lead">MP4を選び、数字キー1から9に割り当てたループ単位をテンキーまたはカードで切り替えます。</p>

      <section class="section">
        <div class="section-title">Files</div>
        <input id="appendInput" class="hidden-input" type="file" multiple accept="video/mp4,video/*" aria-hidden="true" tabindex="-1">
        <input id="folderInput" class="hidden-input" type="file" webkitdirectory aria-hidden="true" tabindex="-1">
        <input id="fileInput" class="file-input" type="file" multiple accept="video/mp4,video/*">
        <div class="actions">
          <button id="folderButton" type="button">フォルダから選ぶ</button>
          <button id="appendButton" type="button">追加読込</button>
          <button id="clearFilesButton" type="button">全登録解除</button>
          <button id="fullscreenButton" type="button">フルスクリーン</button>
          <button id="restartButton" type="button">先頭から再生</button>
          <button id="toggleUiButton" type="button">UI表示切替</button>
        </div>
        <div id="status" class="status">MP4ファイルを選択してください。ドラッグ&ドロップでも追加できます。</div>
      </section>

      <section class="section">
        <div class="section-title">Selected Videos</div>
        <ul id="fileList" class="file-list"></ul>
      </section>

      <section class="section">
        <div class="section-title">Loop Units</div>
        <div id="loopEditors" class="loop-editors"></div>
      </section>

      <section class="section">
        <div class="section-title">Loop Cards</div>
        <div id="cards" class="cards"></div>
      </section>
    </aside>

    <section class="stage" id="stage">
      <div class="video-wrap">
        <video id="player" playsinline preload="metadata"></video>
        <div id="emptyState" class="empty-state">
          <div>
            <strong>再生待機中</strong>
            <span>ファイルを選択して、ループカードまたは数字キーで開始します。</span>
          </div>
        </div>
        <div id="overlay" class="overlay">
          <div class="nowbar">
            <div class="main" id="nowPlaying">現在再生中: なし</div>
            <div class="sub" id="nowLoop">ループ: なし</div>
          </div>
          <div id="overlayCards" class="overlay-cards"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="sheetModal" class="sheet-modal" hidden>
    <figure>
      <img id="sheetModalImg" alt="コンタクトシート">
      <figcaption id="sheetModalCaption"></figcaption>
      <div class="sheet-modal-hint">← → ：前後の動画　Space：選択の切り替え（フォルダから選ぶ時）　クリック / Esc：閉じる</div>
    </figure>
  </div>

  <div id="picker" class="picker" hidden>
    <div class="picker-head">
      <span class="title">フォルダから選ぶ</span>
      <span id="pickerStatus" class="status"></span>
    </div>
    <div id="pickerGrid" class="picker-grid"></div>
    <div class="picker-foot">
      <button id="pickerSelectAll" type="button">すべて選択</button>
      <button id="pickerClear" type="button">選択解除</button>
      <button id="pickerRegister" type="button">選択した動画を登録</button>
      <button id="pickerCancel" type="button">キャンセル</button>
    </div>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "mp4LoopViewer.v1";
      const DEFAULT_LOOPS = {
        1: "1",
        2: "234",
        3: "24",
        4: "1112",
        5: "",
        6: "",
        7: "",
        8: "",
        9: ""
      };

      const state = {
        files: [],
        loops: { ...DEFAULT_LOOPS },
        activeLoop: null,
        stepIndex: 0,
        uiVisible: true,
        overlayIdle: false,
        idleTimer: null,
        rotation: 0,
        zoom: 1
      };

      const ROTATION_STORAGE_KEY = "mp4LoopViewer.rotations.v1";
      let savedRotations = loadRotations();

      function loadRotations() {
        try {
          const parsed = JSON.parse(localStorage.getItem(ROTATION_STORAGE_KEY) || "{}");
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (error) {
          return {};
        }
      }

      function persistRotation() {
        const item = getCurrentFile();
        if (!item || !item.file) return;
        const key = fileCacheKey(item.file);
        const deg = Math.round((state.rotation || 0) * 10) / 10;
        const zoom = Math.round((state.zoom || 1) * 1000) / 1000;
        if (deg || zoom !== 1) {
          savedRotations[key] = { r: deg, z: zoom };
        } else {
          delete savedRotations[key];
        }
        try {
          localStorage.setItem(ROTATION_STORAGE_KEY, JSON.stringify(savedRotations));
        } catch (error) {
          console.warn("Could not save rotation", error);
        }
      }

      function restoreRotationFor(item) {
        const saved = item && item.file ? savedRotations[fileCacheKey(item.file)] : null;
        if (typeof saved === "number") {
          state.rotation = saved;
          state.zoom = 1;
        } else if (saved && typeof saved === "object") {
          state.rotation = Number(saved.r) || 0;
          state.zoom = Number(saved.z) || 1;
        } else {
          state.rotation = 0;
          state.zoom = 1;
        }
      }

      function rotationCoverScale() {
        const videoWidth = els.player.videoWidth;
        const videoHeight = els.player.videoHeight;
        const deg = Math.abs(state.rotation || 0);
        if (!videoWidth || !videoHeight || !deg) return 1;
        const rad = deg * Math.PI / 180;
        return Math.cos(rad) + Math.sin(rad) * Math.max(videoWidth / videoHeight, videoHeight / videoWidth);
      }

      function effectiveZoom() {
        const deg = Math.abs(state.rotation || 0);
        let minZoom = 1;
        if (deg) {
          const width = els.player.clientWidth;
          const height = els.player.clientHeight;
          const wrapWidth = els.videoWrap.clientWidth;
          const wrapHeight = els.videoWrap.clientHeight;
          if (width && height && wrapWidth && wrapHeight) {
            const rad = deg * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            const fit = Math.min(wrapWidth / (width * cos + height * sin), wrapHeight / (width * sin + height * cos));
            minZoom = Math.min(1, fit / rotationCoverScale());
          }
        }
        return { zoom: Math.min(2, Math.max(minZoom, state.zoom || 1)), minZoom };
      }

      function applyRotation() {
        const deg = state.rotation || 0;
        const scale = rotationCoverScale() * effectiveZoom().zoom;
        els.player.style.transform = (deg || scale !== 1) ? `rotate(${deg}deg) scale(${scale})` : "";
      }

      // カット印：1ファイル内の場面転換位置。印で区切られた区間は別々の
      // 「ファイル」（番号）として扱う。印はファイルごとに LocalStorage へ保存し、
      // キーが存在すれば（空配列でも）検出済みとして扱う。
      const CUTS_STORAGE_KEY = "mp4LoopViewer.cuts.v1";
      let savedCuts = loadCuts();

      function loadCuts() {
        try {
          const parsed = JSON.parse(localStorage.getItem(CUTS_STORAGE_KEY) || "{}");
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (error) {
          return {};
        }
      }

      function persistCuts() {
        try {
          localStorage.setItem(CUTS_STORAGE_KEY, JSON.stringify(savedCuts));
        } catch (error) {
          console.warn("Could not save cuts", error);
        }
      }

      function sourceItems(key) {
        return state.files.filter(it => it.file && fileCacheKey(it.file) === key);
      }

      function displayName(item) {
        return item.segCount > 1 ? `${item.name} [${item.segIndex + 1}/${item.segCount}]` : item.name;
      }

      function segmentItemsFor(template, marks, duration) {
        const bounds = [0, ...marks, duration];
        const count = bounds.length - 1;
        const items = [];
        for (let i = 0; i < count; i++) {
          items.push({
            file: template.file,
            index: 0,
            name: template.name,
            url: template.url,
            thumb: "",
            thumbError: false,
            sheet: "",
            sheetError: false,
            meta: template.meta || null,
            loadError: "",
            segStart: bounds[i],
            segEnd: bounds[i + 1],
            segIndex: i,
            segCount: count,
            cutsSettled: true
          });
        }
        return items;
      }

      // 保存済みの印に合わせて、そのファイルの登録を区間アイテムへ組み替える。
      // 再生中のプレイヤーには触らない（メディアは同一なので位置と停止状態は保たれる）。
      function rebuildSourceSegments(key, durationHint) {
        const at = state.files.findIndex(it => it.file && fileCacheKey(it.file) === key);
        if (at < 0) return [];
        const template = state.files[at];
        const marks = Array.isArray(savedCuts[key]) ? savedCuts[key] : [];
        let duration = durationHint || (template.meta ? template.meta.duration : 0);
        if (!duration) {
          const current = getCurrentFile();
          if (current && current.file && fileCacheKey(current.file) === key && Number.isFinite(els.player.duration)) {
            duration = els.player.duration;
          }
        }
        const rest = state.files.filter(it => !(it.file && fileCacheKey(it.file) === key));
        let insert;
        if (marks.length && duration) {
          insert = segmentItemsFor(template, marks, duration);
        } else {
          const stale = template.segCount > 1;
          insert = [{
            ...template,
            segStart: 0,
            segEnd: null,
            segIndex: 0,
            segCount: 1,
            cutsSettled: true,
            ...(stale ? { thumb: "", sheet: "", thumbError: false, sheetError: false } : {})
          }];
        }
        rest.splice(at, 0, ...insert);
        state.files = rest;
        renumberFiles();
        render();
        return insert;
      }

      function probeDuration(item) {
        return new Promise(resolve => {
          const video = document.createElement("video");
          const timer = window.setTimeout(() => done(0), 8000);
          function done(value) {
            window.clearTimeout(timer);
            video.onloadedmetadata = null;
            video.onerror = null;
            video.removeAttribute("src");
            try { video.load(); } catch (error) { /* noop */ }
            resolve(value || 0);
          }
          video.muted = true;
          video.playsInline = true;
          video.preload = "metadata";
          video.src = item.url;
          video.onloadedmetadata = () => done(Number.isFinite(video.duration) ? video.duration : 0);
          video.onerror = () => done(0);
        });
      }

      // 場面転換の自動検出：小さなフレームを等間隔にサンプリングし、
      // 連続フレームの平均差分が大きい位置をカット候補とする。
      function detectCuts(item) {
        return new Promise(resolve => {
          const video = document.createElement("video");
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          let finished = false;
          const overall = window.setTimeout(() => finish({ marks: [], duration: 0 }), 180000);
          function finish(result) {
            if (finished) return;
            finished = true;
            window.clearTimeout(overall);
            video.onloadedmetadata = null;
            video.onerror = null;
            video.onseeked = null;
            video.removeAttribute("src");
            try { video.load(); } catch (error) { /* noop */ }
            resolve(result);
          }
          video.muted = true;
          video.playsInline = true;
          video.preload = "auto";
          video.src = item.url;
          video.onerror = () => finish({ marks: [], duration: 0 });
          video.onloadedmetadata = async () => {
            const duration = video.duration;
            if (!Number.isFinite(duration) || duration <= 1 || !video.videoWidth || !ctx) {
              finish({ marks: [], duration: 0 });
              return;
            }
            const W = 64;
            const H = Math.max(8, Math.round(W * video.videoHeight / video.videoWidth));
            canvas.width = W;
            canvas.height = H;
            const step = Math.max(0.4, duration / 600);
            const times = [];
            const diffs = [];
            let prev = null;
            const seek = t => new Promise(done => {
              let settled = false;
              const timer = window.setTimeout(() => { if (!settled) { settled = true; done(false); } }, 3000);
              video.onseeked = () => {
                if (settled) return;
                settled = true;
                window.clearTimeout(timer);
                done(true);
              };
              try {
                video.currentTime = Math.min(t, duration - .05);
              } catch (error) {
                window.clearTimeout(timer);
                done(false);
              }
            });
            for (let t = 0; t < duration; t += step) {
              if (finished) return;
              if (!await seek(t)) continue;
              let data;
              try {
                ctx.drawImage(video, 0, 0, W, H);
                data = ctx.getImageData(0, 0, W, H).data;
              } catch (error) {
                continue;
              }
              const gray = new Float32Array(W * H);
              for (let i = 0, j = 0; i < data.length; i += 4, j++) {
                gray[j] = (data[i] + data[i + 1] + data[i + 2]) / 3;
              }
              if (prev) {
                let sum = 0;
                for (let j = 0; j < gray.length; j++) sum += Math.abs(gray[j] - prev[j]);
                times.push(t);
                diffs.push(sum / gray.length / 255);
              }
              prev = gray;
            }
            const sorted = diffs.slice().sort((a, b) => a - b);
            const median = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 0;
            const threshold = Math.max(0.30, median * 3);
            const marks = [];
            for (let i = 0; i < diffs.length; i++) {
              if (diffs[i] < threshold) continue;
              const t = Math.round(times[i] * 10) / 10;
              if (t < 0.5 || t > duration - 0.5) continue;
              if (marks.length && t - marks[marks.length - 1] < 1.0) continue;
              marks.push(t);
            }
            finish({ marks, duration });
          };
        });
      }

      // 初回読み込み時：保存済みの印があれば区間化し、無ければ自動検出してから区間化する。
      async function settleItemCuts(item) {
        item.cutsSettled = true;
        const key = fileCacheKey(item.file);
        let marks = Array.isArray(savedCuts[key]) ? savedCuts[key].slice() : null;
        let duration = 0;
        if (marks === null) {
          setStatus(`カットを検出中… ${item.name}`);
          const found = await detectCuts(item);
          marks = found.marks;
          duration = found.duration;
          savedCuts[key] = marks.slice();
          persistCuts();
          if (marks.length) {
            setStatus(`${item.name}：カットを${marks.length}件検出しました。`);
          }
        }
        if (!marks.length) return [item];
        if (!duration) duration = await probeDuration(item);
        if (!duration) return [item];
        const insert = rebuildSourceSegments(key, duration);
        return insert.length ? insert : [item];
      }

      function formatTimeFine(seconds) {
        const s = Math.max(0, seconds || 0);
        return `${formatClock(s)}.${Math.floor((s - Math.floor(s)) * 10)}`;
      }

      function togglePlayPause() {
        if (!getCurrentFile()) return;
        if (els.player.paused) {
          els.player.play().catch(() => {});
          setStatus("再生");
        } else {
          els.player.pause();
          setStatus(`一時停止 ${formatTimeFine(els.player.currentTime)}（←→でコマ送り、Cでカット印）`);
        }
      }

      function stepFrame(direction) {
        if (!getCurrentFile()) return;
        els.player.pause();
        const dur = Number.isFinite(els.player.duration) ? els.player.duration : 0;
        const t = Math.min(Math.max(els.player.currentTime + direction / 30, 0), dur || Infinity);
        try {
          els.player.currentTime = t;
        } catch (error) { /* noop */ }
        setStatus(`コマ送り ${formatTimeFine(t)}（Cでカット印、Spaceで再生）`);
      }

      function addCutMarkAtCurrentTime() {
        const item = getCurrentFile();
        if (!item || !item.file) {
          setStatus("カット印を付ける動画が再生されていません。", true);
          return;
        }
        const key = fileCacheKey(item.file);
        const t = Math.round(els.player.currentTime * 10) / 10;
        const dur = Number.isFinite(els.player.duration) ? els.player.duration : (item.meta ? item.meta.duration : 0);
        const marks = Array.isArray(savedCuts[key]) ? savedCuts[key].slice() : [];
        const edges = [0, ...marks, ...(dur ? [dur] : [])];
        if (edges.some(edge => Math.abs(edge - t) < 1.0)) {
          setStatus("カット印が近すぎます（既存の印・開始・終了から1秒以上あけてください）。", true);
          return;
        }
        marks.push(t);
        marks.sort((a, b) => a - b);
        savedCuts[key] = marks;
        persistCuts();
        const insert = rebuildSourceSegments(key);
        if (insert.length) generateThumbnails(insert);
        setStatus(`カット印を追加しました（${formatTimeFine(t)}）。このファイルは${Math.max(1, sourceItems(key).length)}区間になりました。`);
      }

      function removeCutMark(key, time) {
        const marks = (Array.isArray(savedCuts[key]) ? savedCuts[key] : []).filter(t => Math.abs(t - time) > 0.05);
        savedCuts[key] = marks;
        persistCuts();
        const insert = rebuildSourceSegments(key);
        if (insert.length) generateThumbnails(insert);
        setStatus(marks.length ? `カット印を削除しました（残り${marks.length}件）。` : "カット印をすべて削除し、1ファイルに戻しました。");
      }

      async function redetectCuts(key) {
        const item = sourceItems(key)[0];
        if (!item) return;
        setStatus(`カットを再検出中… ${item.name}`);
        const found = await detectCuts(item);
        savedCuts[key] = found.marks.slice();
        persistCuts();
        const insert = rebuildSourceSegments(key, found.duration);
        if (insert.length) generateThumbnails(insert);
        setStatus(found.marks.length ? `${item.name}：カットを${found.marks.length}件検出しました。` : `${item.name}：カットは検出されませんでした。`);
      }

      const els = {
        app: document.getElementById("app"),
        stage: document.getElementById("stage"),
        videoWrap: document.querySelector(".video-wrap"),
        player: document.getElementById("player"),
        fileInput: document.getElementById("fileInput"),
        appendInput: document.getElementById("appendInput"),
        fileList: document.getElementById("fileList"),
        loopEditors: document.getElementById("loopEditors"),
        cards: document.getElementById("cards"),
        overlayCards: document.getElementById("overlayCards"),
        appendButton: document.getElementById("appendButton"),
        clearFilesButton: document.getElementById("clearFilesButton"),
        fullscreenButton: document.getElementById("fullscreenButton"),
        restartButton: document.getElementById("restartButton"),
        toggleUiButton: document.getElementById("toggleUiButton"),
        status: document.getElementById("status"),
        nowPlaying: document.getElementById("nowPlaying"),
        nowLoop: document.getElementById("nowLoop"),
        overlay: document.getElementById("overlay"),
        emptyState: document.getElementById("emptyState"),
        sheetModal: document.getElementById("sheetModal"),
        sheetModalImg: document.getElementById("sheetModalImg"),
        sheetModalCaption: document.getElementById("sheetModalCaption"),
        folderInput: document.getElementById("folderInput"),
        folderButton: document.getElementById("folderButton"),
        picker: document.getElementById("picker"),
        pickerGrid: document.getElementById("pickerGrid"),
        pickerStatus: document.getElementById("pickerStatus"),
        pickerSelectAll: document.getElementById("pickerSelectAll"),
        pickerClear: document.getElementById("pickerClear"),
        pickerRegister: document.getElementById("pickerRegister"),
        pickerCancel: document.getElementById("pickerCancel")
      };

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          if (saved && typeof saved === "object") {
            state.loops = { ...DEFAULT_LOOPS, ...(saved.loops || {}) };
            state.uiVisible = saved.uiVisible !== false;
            if (Number.isInteger(saved.activeLoop) && saved.activeLoop >= 1 && saved.activeLoop <= 9) {
              state.activeLoop = saved.activeLoop;
            }
          }
        } catch (error) {
          console.warn("Failed to load settings", error);
        }
      }

      function saveSettings() {
        const payload = {
          loops: state.loops,
          uiVisible: state.uiVisible,
          activeLoop: state.activeLoop
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      }

      function setStatus(message, isError = false) {
        els.status.textContent = message;
        els.status.classList.toggle("error", isError);
      }

      function parseLoop(key) {
        const raw = String(state.loops[key] || "");
        const steps = [];
        for (const char of raw) {
          const index = Number(char);
          if (index >= 1 && index <= state.files.length) {
            steps.push(index);
          }
        }
        return { raw, steps };
      }

      function getCurrentFile() {
        if (!state.activeLoop) return null;
        const { steps } = parseLoop(state.activeLoop);
        if (state.stepIndex >= steps.length) {
          state.stepIndex = 0;
        }
        const videoNumber = steps[state.stepIndex];
        return state.files[videoNumber - 1] || null;
      }

      function revokeFiles() {
        for (const item of state.files) {
          URL.revokeObjectURL(item.url);
        }
      }

      function createFileItems(fileList, startIndex) {
        return Array.from(fileList)
          .filter(file => file.type.startsWith("video/") || /\.mp4$/i.test(file.name))
          .map((file, index) => ({
          file,
          index: startIndex + index,
          name: file.name,
          url: URL.createObjectURL(file),
          thumb: "",
          thumbError: false,
          sheet: "",
          sheetError: false,
          meta: null,
          loadError: "",
          segStart: 0,
          segEnd: null,
          segIndex: 0,
          segCount: 1,
          cutsSettled: false
        }));
      }

      function renumberFiles() {
        state.files.forEach((item, index) => {
          item.index = index + 1;
        });
      }

      function resetPlayback() {
        state.stepIndex = 0;
        state.rotation = 0;
        state.zoom = 1;
        els.player.removeAttribute("src");
        resetPlayerSizing();
        els.player.style.transform = "";
        els.player.load();
        els.emptyState.style.display = "";
      }

      function acceptFiles(fileList, mode = "replace") {
        closeSheetModal();
        const slots = Math.max(0, 99 - (mode === "append" ? state.files.length : 0));
        const nextItems = createFileItems(fileList, mode === "append" ? state.files.length + 1 : 1).slice(0, slots);
        applyLoadedItems(nextItems, mode);
      }

      function applyLoadedItems(nextItems, mode) {
        if (mode === "replace") {
          revokeFiles();
          state.files = nextItems;
          renumberFiles();
          resetPlayback();
        } else if (nextItems.length) {
          state.files = state.files.concat(nextItems);
          renumberFiles();
        }

        if (state.files.length === 0) {
          setStatus("動画ファイルが選択されていません。", true);
        } else if (mode === "append") {
          setStatus(nextItems.length ? `${nextItems.length}個の動画を追加しました。` : "追加できる動画ファイルがありませんでした。", nextItems.length === 0);
          generateThumbnails(nextItems);
        } else {
          setStatus(`${state.files.length}個の動画を読み込みました。`);
          generateThumbnails(state.files);
        }
        render();
      }

      function removeFile(fileIndex) {
        closeSheetModal();
        const current = getCurrentFile();
        const removed = state.files[fileIndex];
        if (!removed) return;

        const key = removed.file ? fileCacheKey(removed.file) : null;
        URL.revokeObjectURL(removed.url);
        state.files = key
          ? state.files.filter(it => !(it.file && fileCacheKey(it.file) === key))
          : state.files.filter(it => it !== removed);
        renumberFiles();

        if (!state.files.length) {
          state.activeLoop = null;
          saveSettings();
          resetPlayback();
          setStatus("すべての動画登録を解除しました。");
        } else if (current && current.url === removed.url) {
          resetPlayback();
          if (state.activeLoop && parseLoop(state.activeLoop).steps.length) {
            playCurrent(true);
          }
          setStatus(`${removed.name} の登録を解除しました。`);
        } else {
          setStatus(`${removed.name} の登録を解除しました。`);
        }
        render();
      }

      function clearFiles() {
        closeSheetModal();
        if (!state.files.length) {
          setStatus("解除する動画登録がありません。", true);
          return;
        }
        revokeFiles();
        state.files = [];
        state.activeLoop = null;
        state.stepIndex = 0;
        saveSettings();
        resetPlayback();
        setStatus("すべての動画登録を解除しました。");
        render();
      }

      async function generateThumbnails(items) {
        for (const item of items) {
          if (!state.files.includes(item)) continue;
          let targets = [item];
          if (item.segCount === 1 && !item.cutsSettled) {
            targets = await settleItemCuts(item);
          }
          for (const target of targets) {
            if (!state.files.includes(target)) continue;
            try {
              if (!target.thumb) target.thumb = await createThumbnail(target);
            } catch (error) {
              target.thumbError = true;
              console.warn("Thumbnail failed", target.name, error);
            }
            render();
            if (!state.files.includes(target)) continue;
            try {
              if (!target.sheet) await getContactSheet(target);
            } catch (error) {
              target.sheetError = true;
              console.warn("Contact sheet failed", target.name, error);
            }
            render();
          }
        }
      }

      function formatClock(seconds) {
        const total = Math.max(0, Math.floor(seconds || 0));
        const h = String(Math.floor(total / 3600)).padStart(2, "0");
        const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
        const s = String(total % 60).padStart(2, "0");
        return `${h}:${m}:${s}`;
      }

      function createContactSheet(item) {
        const COLS = 4;
        const ROWS = 4;
        const CELL_W = 320;
        const GAP = 6;
        const PAD = 8;
        const HEADER_H = 66;
        return new Promise((resolve, reject) => {
          const video = document.createElement("video");
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          const overallTimeout = window.setTimeout(() => cleanup(() => reject(new Error("sheet timeout"))), 45000);
          let cellH = 180;
          let duration = 0;
          let winStart = 0;
          let winEnd = 0;

          video.muted = true;
          video.playsInline = true;
          video.preload = "auto";
          video.src = item.url;

          function cleanup(done) {
            window.clearTimeout(overallTimeout);
            video.onloadedmetadata = null;
            video.onerror = null;
            done();
          }

          video.onerror = () => cleanup(() => reject(new Error("load error")));
          video.onloadedmetadata = async () => {
            duration = video.duration;
            if (!Number.isFinite(duration) || duration <= 0 || !video.videoWidth || !video.videoHeight) {
              cleanup(() => reject(new Error("metadata unavailable")));
              return;
            }
            item.meta = { duration, width: video.videoWidth, height: video.videoHeight };
            winStart = item.segStart || 0;
            winEnd = item.segEnd != null ? Math.min(item.segEnd, duration) : duration;
            cellH = Math.max(90, Math.round(CELL_W * video.videoHeight / video.videoWidth));
            canvas.width = PAD * 2 + COLS * CELL_W + (COLS - 1) * GAP;
            canvas.height = PAD * 2 + HEADER_H + ROWS * cellH + (ROWS - 1) * GAP;
            drawHeader();
            try {
              for (let i = 0; i < COLS * ROWS; i++) {
                const t = winStart + (winEnd - winStart) * (i + .5) / (COLS * ROWS);
                await seekTo(video, t);
                drawCell(i, t);
              }
              canvas.toBlob(blob => {
                cleanup(() => resolve({ dataUrl: canvas.toDataURL("image/jpeg", .85), blob }));
              }, "image/jpeg", .85);
            } catch (error) {
              cleanup(() => reject(error));
            }
          };

          function drawHeader() {
            ctx.fillStyle = "#e9e9e9";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#111";
            ctx.font = "600 19px 'Segoe UI', sans-serif";
            ctx.textBaseline = "top";
            const sizeMb = (item.file.size / 1048576).toFixed(2);
            ctx.fillText(`ファイル名: ${item.name}`, PAD, PAD);
            ctx.font = "16px 'Segoe UI', sans-serif";
            ctx.fillText(`ファイル サイズ: ${sizeMb} MB`, PAD, PAD + 24);
            if (item.segCount > 1) {
              ctx.fillText(`解像度: ${video.videoWidth}x${video.videoHeight}  区間: ${formatClock(winStart)} – ${formatClock(winEnd)}（全${formatClock(duration)}・${item.segIndex + 1}/${item.segCount}）`, PAD, PAD + 44);
            } else {
              ctx.fillText(`解像度: ${video.videoWidth}x${video.videoHeight}  再生時間: ${formatClock(duration)}`, PAD, PAD + 44);
            }
          }

          function drawCell(i, t) {
            const col = i % COLS;
            const row = Math.floor(i / COLS);
            const x = PAD + col * (CELL_W + GAP);
            const y = PAD + HEADER_H + row * (cellH + GAP);
            ctx.fillStyle = "#000";
            ctx.fillRect(x, y, CELL_W, cellH);
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const scale = Math.max(CELL_W / vw, cellH / vh);
            const dw = vw * scale;
            const dh = vh * scale;
            ctx.drawImage(video, x + (CELL_W - dw) / 2, y + (cellH - dh) / 2, dw, dh);
            const label = formatClock(t);
            ctx.font = "700 17px 'Segoe UI', sans-serif";
            const tw = ctx.measureText(label).width;
            const lx = x + CELL_W - tw - 12;
            const ly = y + cellH - 24;
            ctx.fillStyle = "rgba(0, 0, 0, .55)";
            ctx.fillRect(lx - 4, ly - 3, tw + 8, 23);
            ctx.fillStyle = "#fff";
            ctx.textBaseline = "top";
            ctx.fillText(label, lx, ly);
          }

          function seekTo(targetVideo, time) {
            return new Promise(done => {
              let settled = false;
              const timer = window.setTimeout(finish, 4000);
              function finish() {
                if (settled) return;
                settled = true;
                window.clearTimeout(timer);
                targetVideo.onseeked = null;
                done();
              }
              targetVideo.onseeked = finish;
              try {
                targetVideo.currentTime = Math.min(Math.max(time, 0), Math.max(duration - .05, 0));
              } catch (error) {
                finish();
              }
            });
          }
        });
      }

      // プレビュー（コンタクトシート）の永続キャッシュ。ファイル名＋サイズ＋更新日時をキーに
      // IndexedDBへ保存し、同じファイルを再度選んだときは生成を省略する。
      const sheetCache = { db: null, failed: false };
      const SHEET_CACHE_MAX = 5000;
      const SHEET_CACHE_MAX_BYTES = 2 * 1024 * 1024 * 1024;

      function sheetCacheDb() {
        if (sheetCache.failed) return Promise.resolve(null);
        if (sheetCache.db) return Promise.resolve(sheetCache.db);
        return new Promise(resolve => {
          let req;
          try {
            req = indexedDB.open("mp4-loop-viewer", 1);
          } catch (error) {
            sheetCache.failed = true;
            resolve(null);
            return;
          }
          req.onupgradeneeded = () => {
            req.result.createObjectStore("sheets", { keyPath: "key" });
          };
          req.onsuccess = () => {
            sheetCache.db = req.result;
            resolve(sheetCache.db);
          };
          req.onerror = () => {
            sheetCache.failed = true;
            resolve(null);
          };
        });
      }

      function fileCacheKey(file) {
        return `v1|${file.name}|${file.size}|${file.lastModified}`;
      }

      // コンタクトシートのキャッシュキー。区間アイテムは範囲も含めて区別する。
      function sheetKeyFor(item) {
        const base = fileCacheKey(item.file);
        return item.segCount > 1 ? `${base}|seg:${item.segStart}-${item.segEnd}` : base;
      }

      function blobToDataUrl(blob) {
        return new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(blob);
        });
      }

      async function cacheGetSheet(key) {
        const db = await sheetCacheDb();
        if (!db) return null;
        const rec = await new Promise(resolve => {
          try {
            const rq = db.transaction("sheets", "readonly").objectStore("sheets").get(key);
            rq.onsuccess = () => resolve(rq.result || null);
            rq.onerror = () => resolve(null);
          } catch (error) {
            resolve(null);
          }
        });
        if (!rec || !rec.blob) return null;
        const dataUrl = await blobToDataUrl(rec.blob);
        return dataUrl ? { dataUrl, meta: rec.meta || null, blob: rec.blob } : null;
      }

      async function cachePutSheet(key, blob, meta) {
        const db = await sheetCacheDb();
        if (!db || !blob) return;
        try {
          const record = { key, blob, meta, savedAt: Date.now() };
          let stored = await cacheStoreRecord(db, record);
          if (!stored) {
            // 容量不足の可能性があるので古いものをまとめて空けて1回だけ再試行する
            await cacheEvictOldest(db, 200);
            stored = await cacheStoreRecord(db, record);
          }
          if (stored) {
            await cachePrune(db);
          }
        } catch (error) {
          console.warn("Sheet cache write failed", error);
        }
      }

      function cacheStoreRecord(db, record) {
        return new Promise(resolve => {
          try {
            const tx = db.transaction("sheets", "readwrite");
            tx.objectStore("sheets").put(record);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
            tx.onabort = () => resolve(false);
          } catch (error) {
            resolve(false);
          }
        });
      }

      async function cacheEvictOldest(db, count) {
        const all = await cacheGetAllSheets(db);
        const victims = all.slice().sort((a, b) => a.savedAt - b.savedAt).slice(0, count);
        if (!victims.length) return;
        const tx = db.transaction("sheets", "readwrite");
        const store = tx.objectStore("sheets");
        for (const rec of victims) store.delete(rec.key);
      }

      function cacheGetAllSheets(db) {
        return new Promise(resolve => {
          try {
            const rq = db.transaction("sheets", "readonly").objectStore("sheets").getAll();
            rq.onsuccess = () => resolve(rq.result || []);
            rq.onerror = () => resolve([]);
          } catch (error) {
            resolve([]);
          }
        });
      }

      async function cachePrune(db) {
        const all = await cacheGetAllSheets(db);
        let totalBytes = all.reduce((sum, rec) => sum + (rec.blob ? rec.blob.size : 0), 0);
        if (all.length <= SHEET_CACHE_MAX && totalBytes <= SHEET_CACHE_MAX_BYTES) return;
        const sorted = all.slice().sort((a, b) => a.savedAt - b.savedAt);
        const victims = [];
        let remaining = all.length;
        for (const rec of sorted) {
          if (remaining <= SHEET_CACHE_MAX && totalBytes <= SHEET_CACHE_MAX_BYTES) break;
          victims.push(rec);
          remaining -= 1;
          totalBytes -= rec.blob ? rec.blob.size : 0;
        }
        if (!victims.length) return;
        const tx = db.transaction("sheets", "readwrite");
        const store = tx.objectStore("sheets");
        for (const rec of victims) store.delete(rec.key);
      }

      async function getContactSheet(item) {
        if (item.sheet) return item.sheet;
        const key = sheetKeyFor(item);
        // 1) 同一フォルダのキャッシュファイルを最優先で読む
        const fromFolder = await folderCacheGet(key);
        if (fromFolder) {
          item.meta = fromFolder.meta;
          item.sheet = fromFolder.dataUrl;
          return item.sheet;
        }
        // 2) ブラウザ内キャッシュ（IndexedDB）
        const cached = await cacheGetSheet(key);
        if (cached) {
          item.meta = cached.meta;
          item.sheet = cached.dataUrl;
          if (cached.blob) {
            folderCachePut(key, cached.blob, item.meta, item.file.size);
          }
          return item.sheet;
        }
        // 3) 新規生成して両方のキャッシュへ保存する
        const made = await createContactSheet(item);
        item.sheet = made.dataUrl;
        if (made.blob) {
          cachePutSheet(key, made.blob, item.meta);
          folderCachePut(key, made.blob, item.meta, item.file.size);
        }
        return item.sheet;
      }

      // フォルダ内キャッシュ：選んだフォルダ直下の `mp4-preview-cache/` に
      // シート画像（JPEG）と index.json を置く。ブラウザのデータを消しても残り、
      // フォルダごと持ち運べる。File System Access API（Chrome）で読み書きする。
      const CACHE_DIR_NAME = "mp4-preview-cache";
      const folderCache = { root: null, dir: null, index: new Map(), writable: false, saveTimer: 0 };

      function fnv1a(str) {
        let h = 0x811c9dc5;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 0x01000193);
        }
        return (h >>> 0).toString(16).padStart(8, "0");
      }

      function sheetFileName(key, size) {
        return `${fnv1a(key)}-${size}.jpg`;
      }

      async function folderCacheDir(create) {
        if (folderCache.dir) return folderCache.dir;
        if (!folderCache.root) return null;
        try {
          folderCache.dir = await folderCache.root.getDirectoryHandle(CACHE_DIR_NAME, { create: !!create });
        } catch (error) {
          return null;
        }
        return folderCache.dir;
      }

      async function folderCacheLoad(rootHandle) {
        folderCache.root = rootHandle;
        folderCache.dir = null;
        folderCache.index = new Map();
        folderCache.writable = true;
        const dir = await folderCacheDir(false);
        if (!dir) return;
        try {
          const idxHandle = await dir.getFileHandle("index.json");
          const idxFile = await idxHandle.getFile();
          const data = JSON.parse(await idxFile.text());
          for (const [key, entry] of Object.entries(data.entries || {})) {
            folderCache.index.set(key, entry);
          }
        } catch (error) {
          // index.json が無い場合は空のキャッシュとして扱う
        }
      }

      async function pruneFolderCache(items) {
        if (!folderCache.dir) return;
        const keys = new Set(items.map(item => sheetKeyFor(item)));
        let changed = false;
        for (const [key, entry] of Array.from(folderCache.index)) {
          if (keys.has(key)) continue;
          folderCache.index.delete(key);
          changed = true;
          try {
            await folderCache.dir.removeEntry(entry.f);
          } catch (error) {
            // 掃除の失敗は無視する
          }
        }
        if (changed) {
          saveFolderCacheIndex();
        }
      }

      async function folderCacheGet(key) {
        const entry = folderCache.index.get(key);
        if (!entry) return null;
        const dir = await folderCacheDir(false);
        if (!dir) return null;
        try {
          const fh = await dir.getFileHandle(entry.f);
          const blob = await fh.getFile();
          const dataUrl = await blobToDataUrl(blob);
          return dataUrl ? { dataUrl, meta: entry.meta || null, blob } : null;
        } catch (error) {
          return null;
        }
      }

      async function folderCachePut(key, blob, meta, sizeHint) {
        if (!folderCache.writable || !folderCache.root || !blob) return;
        try {
          const dir = await folderCacheDir(true);
          if (!dir) {
            folderCache.writable = false;
            return;
          }
          const name = sheetFileName(key, sizeHint || blob.size);
          const fh = await dir.getFileHandle(name, { create: true });
          const writable = await fh.createWritable();
          await writable.write(blob);
          await writable.close();
          folderCache.index.set(key, { f: name, meta });
          scheduleFolderCacheIndexSave();
        } catch (error) {
          folderCache.writable = false;
          console.warn("Folder cache write failed", error);
        }
      }

      function scheduleFolderCacheIndexSave() {
        window.clearTimeout(folderCache.saveTimer);
        folderCache.saveTimer = window.setTimeout(saveFolderCacheIndex, 1200);
      }

      async function saveFolderCacheIndex() {
        window.clearTimeout(folderCache.saveTimer);
        const dir = await folderCacheDir(false);
        if (!dir) return;
        try {
          const fh = await dir.getFileHandle("index.json", { create: true });
          const writable = await fh.createWritable();
          await writable.write(JSON.stringify({ version: 1, entries: Object.fromEntries(folderCache.index) }));
          await writable.close();
        } catch (error) {
          console.warn("Folder cache index save failed", error);
        }
      }

      const picker = {
        candidates: [],
        selected: [],
        queue: [],
        processing: false,
        observer: null
      };

      function isPickerOpen() {
        return !els.picker.hidden;
      }

      function isVideoFile(file) {
        return file.type.startsWith("video/") || /\.(mp4|m4v|mov|webm|mkv)$/i.test(file.name);
      }

      function openPicker(fileList) {
        // 通常のフォルダ入力（File System Access APIが使えない環境向け）。
        // この経路ではフォルダへの書き込みができないので、フォルダキャッシュは読み取りのみ。
        folderCache.writable = false;
        const items = Array.from(fileList).map(file => ({
          file,
          relPath: file.webkitRelativePath || file.name,
          handle: null
        }));
        openPickerItems(items);
      }

      async function openFolderViaHandle() {
        let root;
        try {
          root = await window.showDirectoryPicker({ mode: "readwrite" });
        } catch (error) {
          return; // キャンセル時は何もしない
        }
        const items = [];
        await collectFromDirectory(root, "", items);
        if (!items.length) {
          setStatus("フォルダ内に動画ファイルがありませんでした。", true);
          return;
        }
        await folderCacheLoad(root);
        await pruneFolderCache(items);
        openPickerItems(items);
      }

      async function collectFromDirectory(dirHandle, basePath, out) {
        for await (const entry of dirHandle.values()) {
          if (entry.name === CACHE_DIR_NAME) continue;
          const rel = basePath + entry.name;
          if (entry.kind === "file") {
            if (/\.(mp4|m4v|mov|webm|mkv)$/i.test(entry.name)) {
              try {
                const file = await entry.getFile();
                out.push({ file, relPath: rel, handle: entry });
              } catch (error) {
                console.warn("File read failed", rel, error);
              }
            }
          } else if (entry.kind === "directory") {
            await collectFromDirectory(entry, rel + "/", out);
          }
        }
      }

      function openPickerItems(items) {
        closePicker();
        const videos = items
          .filter(item => isVideoFile(item.file))
          .sort((a, b) => a.relPath.localeCompare(b.relPath, "ja"));
        if (!videos.length) {
          setStatus("フォルダ内に動画ファイルがありませんでした。", true);
          return;
        }
        picker.candidates = videos.map(item => ({
          file: item.file,
          handle: item.handle || null,
          name: item.file.name,
          relPath: item.relPath,
          url: URL.createObjectURL(item.file),
          thumb: "",
          thumbError: false,
          sheet: "",
          sheetError: false,
          meta: null,
          queued: false,
          loadError: ""
        }));
        picker.selected = [];
        els.picker.hidden = false;
        renderPicker();
        setupPickerObserver();
        updatePickerStatus();
      }

      function closePicker() {
        saveFolderCacheIndex();
        if (picker.observer) {
          picker.observer.disconnect();
          picker.observer = null;
        }
        for (const cand of picker.candidates) {
          URL.revokeObjectURL(cand.url);
        }
        picker.candidates = [];
        picker.selected = [];
        picker.queue = [];
        els.picker.hidden = true;
        els.pickerGrid.innerHTML = "";
      }

      function renderPicker() {
        els.pickerGrid.innerHTML = picker.candidates.map((cand, i) => {
          const order = picker.selected.indexOf(cand);
          return `
          <div class="pick-card ${order >= 0 ? "selected" : ""}" data-i="${i}">
            ${order >= 0 ? `<span class="pick-order">${order + 1}</span>` : ""}
            ${cand.sheet ? `<img class="sheet" src="${cand.sheet}" alt="">` : `<span class="thumb-fallback" style="width:100%;height:120px">${cand.sheetError ? "プレビュー生成失敗" : "プレビュー生成待ち"}</span>`}
            <span class="pick-name" title="${escapeHtml(cand.relPath)}">${escapeHtml(cand.name)}</span>
            <span class="pick-note">${cand.meta ? `${formatClock(cand.meta.duration)} ・ ${cand.meta.width}x${cand.meta.height}` : escapeHtml(cand.relPath)}</span>
            <button type="button" class="pick-expand" data-i="${i}">拡大</button>
          </div>`;
        }).join("");
        els.pickerGrid.querySelectorAll(".pick-card").forEach(card => {
          card.addEventListener("click", event => {
            if (event.target.closest(".pick-expand")) return;
            togglePick(Number(card.dataset.i));
          });
        });
        els.pickerGrid.querySelectorAll(".pick-expand").forEach(btn => {
          btn.addEventListener("click", () => {
            openSheetView(picker.candidates, Number(btn.dataset.i), "picker");
          });
        });
        if (picker.observer) {
          els.pickerGrid.querySelectorAll(".pick-card").forEach(card => picker.observer.observe(card));
        }
      }

      function setupPickerObserver() {
        if (picker.observer) picker.observer.disconnect();
        picker.observer = new IntersectionObserver(entries => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            const cand = picker.candidates[Number(entry.target.dataset.i)];
            if (cand && !cand.sheet && !cand.sheetError && !cand.queued) {
              cand.queued = true;
              picker.queue.push(cand);
              processPickerQueue();
            }
          }
        }, { root: els.pickerGrid, rootMargin: "240px" });
        els.pickerGrid.querySelectorAll(".pick-card").forEach(card => picker.observer.observe(card));
      }

      async function processPickerQueue() {
        if (picker.processing) return;
        picker.processing = true;
        while (picker.queue.length) {
          const cand = picker.queue.shift();
          if (!picker.candidates.includes(cand) || cand.sheet || cand.sheetError) continue;
          try {
            await getContactSheet(cand);
          } catch (error) {
            cand.sheetError = true;
            console.warn("Picker sheet failed", cand.name, error);
          }
          if (isPickerOpen()) renderPicker();
        }
        picker.processing = false;
      }

      function togglePick(i) {
        const cand = picker.candidates[i];
        if (!cand) return;
        const at = picker.selected.indexOf(cand);
        if (at >= 0) {
          picker.selected.splice(at, 1);
        } else {
          picker.selected.push(cand);
        }
        renderPicker();
        updatePickerStatus();
      }

      function updatePickerStatus() {
        els.pickerStatus.textContent = `動画 ${picker.candidates.length} 件中 ${picker.selected.length} 件を選択中（クリックした順に登録されます）`;
        els.pickerRegister.textContent = `選択した動画を登録（${picker.selected.length}件）`;
        els.pickerRegister.disabled = picker.selected.length === 0;
      }

      function registerPicked() {
        if (!picker.selected.length) return;
        saveFolderCacheIndex();
        const mode = state.files.length ? "append" : "replace";
        const slots = Math.max(0, 99 - (mode === "append" ? state.files.length : 0));
        const chosen = picker.selected.slice(0, slots);
        const items = chosen.map(cand => ({
          file: cand.file,
          index: 0,
          name: cand.name,
          url: cand.url,
          thumb: cand.thumb || "",
          thumbError: false,
          sheet: cand.sheet || "",
          sheetError: !!cand.sheetError,
          meta: cand.meta || null,
          loadError: ""
        }));
        for (const cand of picker.candidates) {
          if (!chosen.includes(cand)) {
            URL.revokeObjectURL(cand.url);
          }
        }
        if (picker.observer) {
          picker.observer.disconnect();
          picker.observer = null;
        }
        picker.candidates = [];
        picker.selected = [];
        picker.queue = [];
        els.picker.hidden = true;
        els.pickerGrid.innerHTML = "";
        applyLoadedItems(items, mode);
      }

      function createThumbnail(item) {
        return new Promise((resolve, reject) => {
          const video = document.createElement("video");
          const canvas = document.createElement("canvas");
          const timeout = window.setTimeout(() => cleanup(() => reject(new Error("timeout"))), 7000);

          video.muted = true;
          video.playsInline = true;
          video.preload = "metadata";
          video.src = item.url;

          function cleanup(done) {
            window.clearTimeout(timeout);
            video.onloadedmetadata = null;
            video.onloadeddata = null;
            video.onseeked = null;
            video.onerror = null;
            done();
          }

          video.onerror = () => cleanup(() => reject(new Error("load error")));
          video.onloadedmetadata = () => {
            const start = item.segStart || 0;
            const end = item.segEnd != null ? item.segEnd : video.duration;
            const target = Number.isFinite(end) && end - start > .15 ? start + .1 : start;
            if (target === start && video.readyState >= 2) {
              draw();
              return;
            }
            try {
              video.currentTime = target;
            } catch (error) {
              draw();
            }
          };
          video.onloadeddata = () => {
            if (video.currentTime <= (item.segStart || 0) + .01) {
              draw();
            }
          };
          video.onseeked = draw;

          function draw() {
            cleanup(() => {
              const width = video.videoWidth || 160;
              const height = video.videoHeight || 90;
              canvas.width = 136;
              canvas.height = 136;
              const ctx = canvas.getContext("2d");
              ctx.fillStyle = "#111";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              const scale = Math.max(canvas.width / width, canvas.height / height);
              const drawWidth = width * scale;
              const drawHeight = height * scale;
              const x = (canvas.width - drawWidth) / 2;
              const y = (canvas.height - drawHeight) / 2;
              ctx.drawImage(video, x, y, drawWidth, drawHeight);
              resolve(canvas.toDataURL("image/jpeg", .82));
            });
          }
        });
      }

      function startLoop(key, restart = true) {
        const numericKey = Number(key);
        if (!state.files.length) {
          setStatus("先にMP4ファイルを選択してください。", true);
          return;
        }
        const parsed = parseLoop(numericKey);
        if (!parsed.steps.length) {
          setStatus(`キー${numericKey}のループ単位に有効な動画番号がありません。`, true);
          return;
        }
        state.activeLoop = numericKey;
        state.stepIndex = 0;
        saveSettings();
        render();
        playCurrent(restart);
      }

      async function playCurrent(restart = true) {
        const item = getCurrentFile();
        if (!item) {
          setStatus("再生できる動画がありません。", true);
          render();
          return;
        }

        els.emptyState.style.display = "none";
        if (els.player.src !== item.url) {
          els.player.src = item.url;
          resetPlayerSizing();
          restoreRotationFor(item);
          applyRotation();
        }
        els.player.loop = false;
        if (restart) {
          try {
            els.player.currentTime = item.segStart || 0;
          } catch (error) {
            console.warn("Could not reset currentTime", error);
          }
        }
        try {
          await els.player.play();
          setStatus(`キー${state.activeLoop}を再生中。`);
        } catch (error) {
          setStatus("再生を開始できませんでした。カードまたはボタンをもう一度操作してください。", true);
        }
        render();
      }

      function updatePlayerFit() {
        const videoWidth = els.player.videoWidth;
        const videoHeight = els.player.videoHeight;
        const bounds = els.player.parentElement.getBoundingClientRect();
        const boxWidth = Math.floor(bounds.width);
        const boxHeight = Math.floor(bounds.height);
        if (!videoWidth || !videoHeight || !boxWidth || !boxHeight) return;

        const scale = Math.min(boxWidth / videoWidth, boxHeight / videoHeight);
        const displayWidth = Math.floor(videoWidth * scale);
        const displayHeight = Math.floor(videoHeight * scale);

        els.player.style.aspectRatio = `${videoWidth} / ${videoHeight}`;
        els.player.style.width = `${displayWidth}px`;
        els.player.style.height = `${displayHeight}px`;
        applyRotation();
      }

      function resetPlayerSizing() {
        els.player.style.removeProperty("width");
        els.player.style.removeProperty("height");
        els.player.style.removeProperty("aspect-ratio");
      }

      function schedulePlayerFit() {
        updatePlayerFit();
        requestAnimationFrame(updatePlayerFit);
        window.setTimeout(updatePlayerFit, 80);
      }

      function playNextStep() {
        if (!state.activeLoop) return;
        const { steps } = parseLoop(state.activeLoop);
        if (!steps.length) return;
        state.stepIndex = (state.stepIndex + 1) % steps.length;
        playCurrent(true);
      }

      function restartActiveLoop() {
        if (state.activeLoop) {
          startLoop(state.activeLoop, true);
        } else {
          setStatus("再生し直すループ単位を選択してください。", true);
        }
      }

      function updateLoop(key, value) {
        state.loops[key] = value.replace(/[^\d]/g, "").slice(0, 48);
        saveSettings();
        renderCards();
        renderNow();
      }

      function requestFullscreen() {
        const target = els.stage;
        if (!document.fullscreenElement && target.requestFullscreen) {
          target.requestFullscreen().catch(() => setStatus("フルスクリーンを開始できませんでした。", true));
        }
      }

      function exitFullscreen() {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
      }

      function toggleUi() {
        state.uiVisible = !state.uiVisible;
        saveSettings();
        render();
      }

      function resetOverlayIdle() {
        state.overlayIdle = false;
        window.clearTimeout(state.idleTimer);
        state.idleTimer = window.setTimeout(() => {
          if (document.fullscreenElement) {
            state.overlayIdle = true;
            renderOverlayVisibility();
          }
        }, 2600);
        renderOverlayVisibility();
      }

      function renderOverlayVisibility() {
        els.overlay.classList.toggle("hidden", !state.uiVisible);
        els.overlay.classList.toggle("idle", state.overlayIdle && state.uiVisible);
      }

      function render() {
        renderFiles();
        renderEditors();
        renderCards();
        renderNow();
        renderOverlayVisibility();
      }

      function renderFiles() {
        if (!state.files.length) {
          els.fileList.innerHTML = '<li class="status">未選択</li>';
          return;
        }
        els.fileList.innerHTML = state.files.map(item => `
          <li class="file-row">
            <span class="num">${item.index}</span>
            ${renderThumb(item, "thumb")}
            <div class="file-meta">
              <div class="file-name" title="${escapeHtml(item.name)}">${escapeHtml(displayName(item))}</div>
              <div class="file-note">${escapeHtml(fileNote(item))}</div>
            </div>
            ${item.segIndex > 0 ? `<button type="button" class="remove-cut" data-key="${escapeHtml(fileCacheKey(item.file))}" data-time="${item.segStart}" title="このカット印を削除して前後の区間を結合">✂×</button>` : ""}
            ${item.segIndex === 0 ? `<button type="button" class="redetect" data-key="${escapeHtml(fileCacheKey(item.file))}" title="カット印を自動で検出し直す">再検出</button>` : ""}
            <button type="button" class="remove-file" data-index="${item.index - 1}" title="登録解除（区間に分かれている場合はファイルごと）" aria-label="${escapeHtml(item.name)} の登録解除">×</button>
            ${item.sheet ? `<img class="sheet" src="${item.sheet}" data-index="${item.index - 1}" alt="${escapeHtml(item.name)} のプレビュー" title="クリックで拡大">` : ""}
          </li>
        `).join("");
        els.fileList.querySelectorAll(".remove-file").forEach(button => {
          button.addEventListener("click", () => removeFile(Number(button.dataset.index)));
        });
        els.fileList.querySelectorAll(".remove-cut").forEach(button => {
          button.addEventListener("click", () => removeCutMark(button.dataset.key, Number(button.dataset.time)));
        });
        els.fileList.querySelectorAll(".redetect").forEach(button => {
          button.addEventListener("click", () => redetectCuts(button.dataset.key));
        });
        els.fileList.querySelectorAll(".sheet").forEach(img => {
          img.addEventListener("click", () => openSheetView(state.files, Number(img.dataset.index), "files"));
        });
      }

      function fileNote(item) {
        if (item.segCount > 1) {
          const range = `${formatClock(item.segStart)} – ${formatClock(item.segEnd)}`;
          if (item.thumbError && item.sheetError) return `${range} ・ サムネイル生成失敗`;
          if (item.meta) return `${range} ・ 全体 ${formatClock(item.meta.duration)}`;
          if (item.sheetError) return `${range} ・ プレビュー生成失敗`;
          return `${range} ・ プレビュー生成中…`;
        }
        if (item.thumbError && item.sheetError) return "サムネイル生成失敗";
        if (item.meta) return `${formatClock(item.meta.duration)} ・ ${item.meta.width}x${item.meta.height}`;
        if (item.sheetError) return "プレビュー生成失敗";
        return "プレビュー生成中…";
      }

      // 拡大表示の閲覧状態。list は表示対象の配列（登録済みファイル or ピッカー候補）、
      // context は "files" | "picker"。左右キーで前後の動画へ移動し、
      // ピッカーでは Space で選択/解除できる。
      const sheetView = { list: [], index: -1, context: "" };

      function openSheetView(list, index, context) {
        if (!list.length) return;
        sheetView.list = list;
        sheetView.context = context;
        els.sheetModal.hidden = false;
        showSheetAt(index);
      }

      async function showSheetAt(index) {
        const n = sheetView.list.length;
        if (!n) return;
        sheetView.index = ((index % n) + n) % n;
        const item = sheetView.list[sheetView.index];
        renderSheetModal();
        if (!item.sheet && !item.sheetError) {
          try {
            await getContactSheet(item);
          } catch (error) {
            item.sheetError = true;
          }
          if (isSheetModalOpen() && sheetView.list[sheetView.index] === item) {
            renderSheetModal();
          }
          if (sheetView.context === "picker" && isPickerOpen()) renderPicker();
          if (sheetView.context === "files") renderFileList();
        }
        prefetchSheet(sheetView.index + 1);
        prefetchSheet(sheetView.index - 1);
      }

      function prefetchSheet(index) {
        const n = sheetView.list.length;
        if (!n) return;
        const item = sheetView.list[((index % n) + n) % n];
        if (item && !item.sheet && !item.sheetError) {
          getContactSheet(item).catch(() => {
            item.sheetError = true;
          });
        }
      }

      function renderSheetModal() {
        const item = sheetView.list[sheetView.index];
        if (!item) return;
        if (item.sheet) {
          els.sheetModalImg.src = item.sheet;
          els.sheetModalImg.style.display = "";
        } else {
          els.sheetModalImg.removeAttribute("src");
          els.sheetModalImg.style.display = "none";
        }
        let caption = `${displayName(item)}（${sheetView.index + 1} / ${sheetView.list.length}）`;
        if (sheetView.context === "picker") {
          const order = picker.selected.indexOf(item);
          caption += order >= 0 ? ` ・ 選択中（${order + 1}番目に登録）` : " ・ 未選択";
        }
        if (!item.sheet) {
          caption += item.sheetError ? " ・ プレビュー生成失敗" : " ・ プレビュー生成中…";
        }
        els.sheetModalCaption.textContent = caption;
      }

      function stepSheet(delta) {
        showSheetAt(sheetView.index + delta);
      }

      function toggleSheetSelection() {
        if (sheetView.context !== "picker") return;
        const item = sheetView.list[sheetView.index];
        if (!item) return;
        const at = picker.selected.indexOf(item);
        if (at >= 0) {
          picker.selected.splice(at, 1);
        } else {
          picker.selected.push(item);
        }
        renderSheetModal();
        renderPicker();
        updatePickerStatus();
      }

      function closeSheetModal() {
        els.sheetModal.hidden = true;
        els.sheetModalImg.removeAttribute("src");
        sheetView.list = [];
        sheetView.index = -1;
        sheetView.context = "";
      }

      function isSheetModalOpen() {
        return !els.sheetModal.hidden;
      }

      function renderEditors() {
        els.loopEditors.innerHTML = "";
        for (let key = 1; key <= 9; key++) {
          const row = document.createElement("div");
          row.className = "loop-edit-row";
          row.innerHTML = `
            <label for="loop-${key}">キー${key}</label>
            <input id="loop-${key}" inputmode="numeric" autocomplete="off" value="${escapeHtml(state.loops[key] || "")}" aria-label="キー${key}のループ単位">
          `;
          const input = row.querySelector("input");
          input.addEventListener("input", () => updateLoop(key, input.value));
          els.loopEditors.appendChild(row);
        }
      }

      function renderCards() {
        const html = Array.from({ length: 9 }, (_, index) => renderLoopCard(index + 1, false)).join("");
        const compactHtml = Array.from({ length: 9 }, (_, index) => renderLoopCard(index + 1, true)).join("");
        els.cards.innerHTML = html;
        els.overlayCards.innerHTML = compactHtml;
        bindCardClicks(els.cards);
        bindCardClicks(els.overlayCards);
      }

      function bindCardClicks(root) {
        root.querySelectorAll(".loop-card").forEach(card => {
          card.addEventListener("click", () => {
            if (!card.classList.contains("disabled")) {
              startLoop(Number(card.dataset.key), true);
            }
          });
        });
      }

      function renderLoopCard(key, compact) {
        const { raw, steps } = parseLoop(key);
        const active = state.activeLoop === key;
        const disabled = steps.length === 0;
        const stepLabel = steps.length ? steps.join(" / ") : "有効な動画なし";
        const status = steps.length ? `${steps.length} steps` : "無効";
        const classes = ["loop-card", compact ? "compact" : "", active ? "active" : "", disabled ? "disabled" : ""].filter(Boolean).join(" ");
        return `
          <button type="button" class="${classes}" data-key="${key}" ${disabled ? "disabled" : ""}>
            ${renderLoopThumbs(steps)}
            <span class="loop-info">
              <span class="loop-key">キー${key}</span>
