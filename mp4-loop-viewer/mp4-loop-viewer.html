<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MP4 Loop Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050607;
      --panel: #111418;
      --panel-2: #171b20;
      --line: #303741;
      --line-strong: #6aa6ff;
      --text: #f3f5f7;
      --muted: #a6afb9;
      --danger: #ff7777;
      --ok: #88d498;
      --shadow: 0 18px 48px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      letter-spacing: 0;
    }

    body {
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #202832;
      color: var(--text);
      min-height: 36px;
      padding: 0 14px;
      cursor: pointer;
    }

    button:hover {
      border-color: #7a8798;
      background: #27313d;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(255,255,255,.035), transparent 36%),
        var(--bg);
    }

    .sidebar {
      height: 100vh;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: rgba(11, 14, 18, .96);
      padding: 18px;
    }

    .stage {
      position: relative;
      min-width: 0;
      height: 100vh;
      display: block;
      overflow: hidden;
      background: #000;
    }

    .stage:fullscreen {
      width: 100vw;
      height: 100vh;
    }

    .video-wrap {
      position: absolute;
      inset: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.04), transparent 50%),
        #000;
    }

    video#player {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 22px;
      font-weight: 650;
    }

    .overlay {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: grid;
      gap: 10px;
      opacity: 1;
      transition: opacity .18s ease;
      pointer-events: auto;
    }

    .overlay.hidden,
    .overlay.idle {
      opacity: 0;
      pointer-events: none;
    }

    .nowbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 8px;
      background: rgba(8, 10, 13, .72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .nowbar .main {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .nowbar .sub {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .overlay-cards {
      display: grid;
      grid-template-columns: repeat(9, minmax(92px, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 700;
    }

    .lead {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .section {
      display: grid;
      gap: 10px;
      padding: 14px 0;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .file-input {
      width: 100%;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hidden-input {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.error {
      color: var(--danger);
    }

    .file-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .file-row {
      display: grid;
      grid-template-columns: 30px 68px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 78px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .num {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #252d36;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
    }

    .file-meta {
      min-width: 0;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
    }

    .file-note {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .remove-file {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: 6px;
      color: #ffc2c2;
      background: #2a1719;
      border-color: #5d2b31;
      font-size: 18px;
      line-height: 1;
    }

    .remove-file:hover {
      color: #fff;
      background: #492126;
      border-color: #a64c57;
    }

    .thumb {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 6px;
      background: #222;
      border: 1px solid rgba(255,255,255,.12);
      flex: 0 0 auto;
    }

    .thumb-fallback {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.12);
      background: #1d2229;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 5px;
      overflow: hidden;
    }

    .sheet {
      grid-column: 1 / -1;
      display: block;
      width: 100%;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.12);
      cursor: zoom-in;
      background: #e9e9e9;
    }

    .sheet-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, .88);
      cursor: zoom-out;
    }

    .sheet-modal[hidden] {
      display: none;
    }

    .sheet-modal figure {
      margin: 0;
      display: grid;
      gap: 10px;
      justify-items: center;
      max-width: 94vw;
      max-height: 94vh;
    }

    .sheet-modal img {
      max-width: 94vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    .sheet-modal figcaption {
      color: var(--text);
      font-size: 14px;
    }

    .sheet-modal-hint {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .picker {
      position: fixed;
      inset: 0;
      z-index: 55;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: rgba(5, 6, 7, .97);
      padding: 18px;
      gap: 14px;
    }

    .picker[hidden] {
      display: none;
    }

    .picker-head,
    .picker-foot {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .picker-head .title {
      font-size: 18px;
      font-weight: 700;
      margin-right: auto;
    }

    .picker-grid {
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
      align-content: start;
      padding-right: 4px;
    }

    .pick-card {
      position: relative;
      display: grid;
      gap: 7px;
      padding: 8px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      cursor: pointer;
      text-align: left;
      color: var(--text);
    }

    .pick-card.selected {
      border-color: var(--line-strong);
      background: #142133;
    }

    .pick-card .sheet {
      cursor: pointer;
    }

    .pick-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .pick-note {
      color: var(--muted);
      font-size: 12px;
    }

    .pick-order {
      position: absolute;
      top: 12px;
      left: 12px;
      display: grid;
      place-items: center;
      min-width: 30px;
      height: 30px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--line-strong);
      color: #06121f;
      font-weight: 800;
      font-size: 15px;
      box-shadow: var(--shadow);
    }

    .pick-expand {
      justify-self: end;
      min-height: 28px;
      padding: 0 10px;
      font-size: 12px;
    }

    .loop-editors {
      display: grid;
      gap: 7px;
    }

    .loop-edit-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .loop-edit-row label {
      color: var(--muted);
      font-size: 13px;
    }

    .loop-edit-row input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #080a0d;
      color: var(--text);
      padding: 0 10px;
    }

    .loop-edit-row input:focus {
      outline: 2px solid rgba(106,166,255,.28);
      border-color: var(--line-strong);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .loop-card {
      position: relative;
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 9px;
      min-height: 86px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
    }

    .loop-card:hover {
      border-color: #778390;
      background: var(--panel-2);
    }

    .loop-card.active {
      border-color: var(--line-strong);
      background: #142133;
      box-shadow: 0 0 0 1px rgba(106,166,255,.2) inset;
    }

    .loop-card.disabled {
      opacity: .42;
      cursor: not-allowed;
    }

    .loop-card.compact {
      grid-template-columns: 48px minmax(0, 1fr);
      min-height: 70px;
      padding: 7px;
      background: rgba(13, 16, 21, .82);
      backdrop-filter: blur(10px);
    }

    .loop-card.compact .thumb,
    .loop-card.compact .thumb-fallback,
    .loop-card.compact .thumb-stack {
      width: 48px;
      height: 48px;
    }

    .loop-card.compact .mini-thumb {
      width: 32px;
      height: 32px;
    }

    .thumb-stack {
      position: relative;
      width: 68px;
      height: 68px;
      overflow: hidden;
      border-radius: 6px;
      background: #171b20;
    }

    .mini-thumb {
      position: absolute;
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,.18);
      background: #222;
      box-shadow: 0 5px 14px rgba(0,0,0,.35);
    }

    .mini-fallback {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
    }

    .mini-thumb:nth-child(1) { left: 0; top: 0; z-index: 4; }
    .mini-thumb:nth-child(2) { left: 12px; top: 8px; z-index: 3; }
    .mini-thumb:nth-child(3) { left: 23px; top: 16px; z-index: 2; }
    .mini-thumb:nth-child(4) { left: 8px; top: 25px; z-index: 1; }

    .loop-info {
      min-width: 0;
      display: grid;
      gap: 4px;
      align-content: center;
    }

    .loop-key {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .loop-spec {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 700;
    }

    .loop-steps {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .loop-state {
      color: var(--ok);
      font-size: 12px;
    }

    .disabled .loop-state {
      color: var(--danger);
    }

    .drop-target {
      outline: 2px solid var(--line-strong);
      outline-offset: -8px;
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 360px minmax(0, 1fr);
      }

      .overlay-cards {
        grid-template-columns: repeat(5, minmax(92px, 1fr));
      }
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }

      .app {
        display: block;
      }

      .sidebar {
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .stage {
        height: 70vh;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .overlay-cards {
        grid-template-columns: repeat(3, minmax(92px, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <aside class="sidebar">
      <h1>MP4 Loop Viewer</h1>
      <p class="lead">MP4を選び、数字キー1から9に割り当てたループ単位をテンキーまたはカードで切り替えます。</p>

      <section class="section">
        <div class="section-title">Files</div>
        <input id="appendInput" class="hidden-input" type="file" multiple accept="video/mp4,video/*" aria-hidden="true" tabindex="-1">
        <input id="folderInput" class="hidden-input" type="file" webkitdirectory aria-hidden="true" tabindex="-1">
        <input id="fileInput" class="file-input" type="file" multiple accept="video/mp4,video/*">
        <div class="actions">
          <button id="folderButton" type="button">フォルダから選ぶ</button>
          <button id="appendButton" type="button">追加読込</button>
          <button id="clearFilesButton" type="button">全登録解除</button>
          <button id="fullscreenButton" type="button">フルスクリーン</button>
          <button id="restartButton" type="button">先頭から再生</button>
          <button id="toggleUiButton" type="button">UI表示切替</button>
        </div>
        <div id="status" class="status">MP4ファイルを選択してください。ドラッグ&ドロップでも追加できます。</div>
      </section>

      <section class="section">
        <div class="section-title">Selected Videos</div>
        <ul id="fileList" class="file-list"></ul>
      </section>

      <section class="section">
        <div class="section-title">Loop Units</div>
        <div id="loopEditors" class="loop-editors"></div>
      </section>

      <section class="section">
        <div class="section-title">Loop Cards</div>
        <div id="cards" class="cards"></div>
      </section>
    </aside>

    <section class="stage" id="stage">
      <div class="video-wrap">
        <video id="player" playsinline preload="metadata"></video>
        <div id="emptyState" class="empty-state">
          <div>
            <strong>再生待機中</strong>
            <span>ファイルを選択して、ループカードまたは数字キーで開始します。</span>
          </div>
        </div>
        <div id="overlay" class="overlay">
          <div class="nowbar">
            <div class="main" id="nowPlaying">現在再生中: なし</div>
            <div class="sub" id="nowLoop">ループ: なし</div>
          </div>
          <div id="overlayCards" class="overlay-cards"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="sheetModal" class="sheet-modal" hidden>
    <figure>
      <img id="sheetModalImg" alt="コンタクトシート">
      <figcaption id="sheetModalCaption"></figcaption>
      <div class="sheet-modal-hint">← → ：前後の動画　Space：選択の切り替え（フォルダから選ぶ時）　クリック / Esc：閉じる</div>
    </figure>
  </div>

  <div id="picker" class="picker" hidden>
    <div class="picker-head">
      <span class="title">フォルダから選ぶ</span>
      <span id="pickerStatus" class="status"></span>
    </div>
    <div id="pickerGrid" class="picker-grid"></div>
    <div class="picker-foot">
      <button id="pickerSelectAll" type="button">すべて選択</button>
      <button id="pickerClear" type="button">選択解除</button>
      <button id="pickerRegister" type="button">選択した動画を登録</button>
      <button id="pickerCancel" type="button">キャンセル</button>
    </div>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "mp4LoopViewer.v1";
      const DEFAULT_LOOPS = {
        1: "1",
        2: "234",
        3: "24",
        4: "1112",
        5: "",
        6: "",
        7: "",
        8: "",
        9: ""
      };

      const state = {
        files: [],
        loops: { ...DEFAULT_LOOPS },
        activeLoop: null,
        stepIndex: 0,
        uiVisible: true,
        overlayIdle: false,
        idleTimer: null
      };

      const els = {
        app: document.getElementById("app"),
        stage: document.getElementById("stage"),
        player: document.getElementById("player"),
        fileInput: document.getElementById("fileInput"),
        appendInput: document.getElementById("appendInput"),
        fileList: document.getElementById("fileList"),
        loopEditors: document.getElementById("loopEditors"),
        cards: document.getElementById("cards"),
        overlayCards: document.getElementById("overlayCards"),
        appendButton: document.getElementById("appendButton"),
        clearFilesButton: document.getElementById("clearFilesButton"),
        fullscreenButton: document.getElementById("fullscreenButton"),
        restartButton: document.getElementById("restartButton"),
        toggleUiButton: document.getElementById("toggleUiButton"),
        status: document.getElementById("status"),
        nowPlaying: document.getElementById("nowPlaying"),
        nowLoop: document.getElementById("nowLoop"),
        overlay: document.getElementById("overlay"),
        emptyState: document.getElementById("emptyState"),
        sheetModal: document.getElementById("sheetModal"),
        sheetModalImg: document.getElementById("sheetModalImg"),
        sheetModalCaption: document.getElementById("sheetModalCaption"),
        folderInput: document.getElementById("folderInput"),
        folderButton: document.getElementById("folderButton"),
        picker: document.getElementById("picker"),
        pickerGrid: document.getElementById("pickerGrid"),
        pickerStatus: document.getElementById("pickerStatus"),
        pickerSelectAll: document.getElementById("pickerSelectAll"),
        pickerClear: document.getElementById("pickerClear"),
        pickerRegister: document.getElementById("pickerRegister"),
        pickerCancel: document.getElementById("pickerCancel")
      };

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          if (saved && typeof saved === "object") {
            state.loops = { ...DEFAULT_LOOPS, ...(saved.loops || {}) };
            state.uiVisible = saved.uiVisible !== false;
            if (Number.isInteger(saved.activeLoop) && saved.activeLoop >= 1 && saved.activeLoop <= 9) {
              state.activeLoop = saved.activeLoop;
            }
          }
        } catch (error) {
          console.warn("Failed to load settings", error);
        }
      }

      function saveSettings() {
        const payload = {
          loops: state.loops,
          uiVisible: state.uiVisible,
          activeLoop: state.activeLoop
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      }

      function setStatus(message, isError = false) {
        els.status.textContent = message;
        els.status.classList.toggle("error", isError);
      }

      function parseLoop(key) {
        const raw = String(state.loops[key] || "");
        const steps = [];
        for (const char of raw) {
          const index = Number(char);
          if (index >= 1 && index <= state.files.length) {
            steps.push(index);
          }
        }
        return { raw, steps };
      }

      function getCurrentFile() {
        if (!state.activeLoop) return null;
        const { steps } = parseLoop(state.activeLoop);
        if (state.stepIndex >= steps.length) {
          state.stepIndex = 0;
        }
        const videoNumber = steps[state.stepIndex];
        return state.files[videoNumber - 1] || null;
      }

      function revokeFiles() {
        for (const item of state.files) {
          URL.revokeObjectURL(item.url);
        }
      }

      function createFileItems(fileList, startIndex) {
        return Array.from(fileList)
          .filter(file => file.type.startsWith("video/") || /\.mp4$/i.test(file.name))
          .map((file, index) => ({
          file,
          index: startIndex + index,
          name: file.name,
          url: URL.createObjectURL(file),
          thumb: "",
          thumbError: false,
          sheet: "",
          sheetError: false,
          meta: null,
          loadError: ""
        }));
      }

      function renumberFiles() {
        state.files.forEach((item, index) => {
          item.index = index + 1;
        });
      }

      function resetPlayback() {
        state.stepIndex = 0;
        els.player.removeAttribute("src");
        resetPlayerSizing();
        els.player.load();
        els.emptyState.style.display = "";
      }

      function acceptFiles(fileList, mode = "replace") {
        closeSheetModal();
        const slots = Math.max(0, 99 - (mode === "append" ? state.files.length : 0));
        const nextItems = createFileItems(fileList, mode === "append" ? state.files.length + 1 : 1).slice(0, slots);
        applyLoadedItems(nextItems, mode);
      }

      function applyLoadedItems(nextItems, mode) {
        if (mode === "replace") {
          revokeFiles();
          state.files = nextItems;
          renumberFiles();
          resetPlayback();
        } else if (nextItems.length) {
          state.files = state.files.concat(nextItems);
          renumberFiles();
        }

        if (state.files.length === 0) {
          setStatus("動画ファイルが選択されていません。", true);
        } else if (mode === "append") {
          setStatus(nextItems.length ? `${nextItems.length}個の動画を追加しました。` : "追加できる動画ファイルがありませんでした。", nextItems.length === 0);
          generateThumbnails(nextItems);
        } else {
          setStatus(`${state.files.length}個の動画を読み込みました。`);
          generateThumbnails(state.files);
        }
        render();
      }

      function removeFile(fileIndex) {
        closeSheetModal();
        const current = getCurrentFile();
        const removed = state.files[fileIndex];
        if (!removed) return;

        URL.revokeObjectURL(removed.url);
        state.files.splice(fileIndex, 1);
        renumberFiles();

        if (!state.files.length) {
          state.activeLoop = null;
          saveSettings();
          resetPlayback();
          setStatus("すべての動画登録を解除しました。");
        } else if (current && current.url === removed.url) {
          resetPlayback();
          if (state.activeLoop && parseLoop(state.activeLoop).steps.length) {
            playCurrent(true);
          }
          setStatus(`${removed.name} の登録を解除しました。`);
        } else {
          setStatus(`${removed.name} の登録を解除しました。`);
        }
        render();
      }

      function clearFiles() {
        closeSheetModal();
        if (!state.files.length) {
          setStatus("解除する動画登録がありません。", true);
          return;
        }
        revokeFiles();
        state.files = [];
        state.activeLoop = null;
        state.stepIndex = 0;
        saveSettings();
        resetPlayback();
        setStatus("すべての動画登録を解除しました。");
        render();
      }

      async function generateThumbnails(items) {
        for (const item of items) {
          if (!state.files.includes(item)) continue;
          try {
            if (!item.thumb) item.thumb = await createThumbnail(item);
          } catch (error) {
            item.thumbError = true;
            console.warn("Thumbnail failed", item.name, error);
          }
          render();
          if (!state.files.includes(item)) continue;
          try {
            if (!item.sheet) await getContactSheet(item);
          } catch (error) {
            item.sheetError = true;
            console.warn("Contact sheet failed", item.name, error);
          }
          render();
        }
      }

      function formatClock(seconds) {
        const total = Math.max(0, Math.floor(seconds || 0));
        const h = String(Math.floor(total / 3600)).padStart(2, "0");
        const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
        const s = String(total % 60).padStart(2, "0");
        return `${h}:${m}:${s}`;
      }

      function createContactSheet(item) {
        const COLS = 4;
        const ROWS = 4;
        const CELL_W = 320;
        const GAP = 6;
        const PAD = 8;
        const HEADER_H = 66;
        return new Promise((resolve, reject) => {
          const video = document.createElement("video");
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          const overallTimeout = window.setTimeout(() => cleanup(() => reject(new Error("sheet timeout"))), 45000);
          let cellH = 180;
          let duration = 0;

          video.muted = true;
          video.playsInline = true;
          video.preload = "auto";
          video.src = item.url;

          function cleanup(done) {
            window.clearTimeout(overallTimeout);
            video.onloadedmetadata = null;
            video.onerror = null;
            done();
          }

          video.onerror = () => cleanup(() => reject(new Error("load error")));
          video.onloadedmetadata = async () => {
            duration = video.duration;
            if (!Number.isFinite(duration) || duration <= 0 || !video.videoWidth || !video.videoHeight) {
              cleanup(() => reject(new Error("metadata unavailable")));
              return;
            }
            item.meta = { duration, width: video.videoWidth, height: video.videoHeight };
            cellH = Math.max(90, Math.round(CELL_W * video.videoHeight / video.videoWidth));
            canvas.width = PAD * 2 + COLS * CELL_W + (COLS - 1) * GAP;
            canvas.height = PAD * 2 + HEADER_H + ROWS * cellH + (ROWS - 1) * GAP;
            drawHeader();
            try {
              for (let i = 0; i < COLS * ROWS; i++) {
                const t = duration * (i + .5) / (COLS * ROWS);
                await seekTo(video, t);
                drawCell(i, t);
              }
              canvas.toBlob(blob => {
                cleanup(() => resolve({ dataUrl: canvas.toDataURL("image/jpeg", .85), blob }));
              }, "image/jpeg", .85);
            } catch (error) {
              cleanup(() => reject(error));
            }
          };

          function drawHeader() {
            ctx.fillStyle = "#e9e9e9";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#111";
            ctx.font = "600 19px 'Segoe UI', sans-serif";
            ctx.textBaseline = "top";
            const sizeMb = (item.file.size / 1048576).toFixed(2);
            ctx.fillText(`ファイル名: ${item.name}`, PAD, PAD);
            ctx.font = "16px 'Segoe UI', sans-serif";
            ctx.fillText(`ファイル サイズ: ${sizeMb} MB`, PAD, PAD + 24);
            ctx.fillText(`解像度: ${video.videoWidth}x${video.videoHeight}  再生時間: ${formatClock(duration)}`, PAD, PAD + 44);
          }

          function drawCell(i, t) {
            const col = i % COLS;
            const row = Math.floor(i / COLS);
            const x = PAD + col * (CELL_W + GAP);
            const y = PAD + HEADER_H + row * (cellH + GAP);
            ctx.fillStyle = "#000";
            ctx.fillRect(x, y, CELL_W, cellH);
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const scale = Math.max(CELL_W / vw, cellH / vh);
            const dw = vw * scale;
            const dh = vh * scale;
            ctx.drawImage(video, x + (CELL_W - dw) / 2, y + (cellH - dh) / 2, dw, dh);
            const label = formatClock(t);
            ctx.font = "700 17px 'Segoe UI', sans-serif";
            const tw = ctx.measureText(label).width;
            const lx = x + CELL_W - tw - 12;
            const ly = y + cellH - 24;
            ctx.fillStyle = "rgba(0, 0, 0, .55)";
            ctx.fillRect(lx - 4, ly - 3, tw + 8, 23);
            ctx.fillStyle = "#fff";
            ctx.textBaseline = "top";
            ctx.fillText(label, lx, ly);
          }

          function seekTo(targetVideo, time) {
            return new Promise(done => {
              let settled = false;
              const timer = window.setTimeout(finish, 4000);
              function finish() {
                if (settled) return;
                settled = true;
                window.clearTimeout(timer);
                targetVideo.onseeked = null;
                done();
              }
              targetVideo.onseeked = finish;
              try {
                targetVideo.currentTime = Math.min(Math.max(time, 0), Math.max(duration - .05, 0));
              } catch (error) {
                finish();
              }
            });
          }
        });
      }

      // プレビュー（コンタクトシート）の永続キャッシュ。ファイル名＋サイズ＋更新日時をキーに
      // IndexedDBへ保存し、同じファイルを再度選んだときは生成を省略する。
      const sheetCache = { db: null, failed: false };
      const SHEET_CACHE_MAX = 300;

      function sheetCacheDb() {
        if (sheetCache.failed) return Promise.resolve(null);
        if (sheetCache.db) return Promise.resolve(sheetCache.db);
        return new Promise(resolve => {
          let req;
          try {
            req = indexedDB.open("mp4-loop-viewer", 1);
          } catch (error) {
            sheetCache.failed = true;
            resolve(null);
            return;
          }
          req.onupgradeneeded = () => {
            req.result.createObjectStore("sheets", { keyPath: "key" });
          };
          req.onsuccess = () => {
            sheetCache.db = req.result;
            resolve(sheetCache.db);
          };
          req.onerror = () => {
            sheetCache.failed = true;
            resolve(null);
          };
        });
      }

      function fileCacheKey(file) {
        return `v1|${file.name}|${file.size}|${file.lastModified}`;
      }

      async function cacheGetSheet(file) {
        const db = await sheetCacheDb();
        if (!db) return null;
        const rec = await new Promise(resolve => {
          try {
            const rq = db.transaction("sheets", "readonly").objectStore("sheets").get(fileCacheKey(file));
            rq.onsuccess = () => resolve(rq.result || null);
            rq.onerror = () => resolve(null);
          } catch (error) {
            resolve(null);
          }
        });
        if (!rec || !rec.blob) return null;
        const dataUrl = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(rec.blob);
        });
        return dataUrl ? { dataUrl, meta: rec.meta || null } : null;
      }

      async function cachePutSheet(file, blob, meta) {
        const db = await sheetCacheDb();
        if (!db || !blob) return;
        try {
          await new Promise(resolve => {
            const tx = db.transaction("sheets", "readwrite");
            tx.objectStore("sheets").put({ key: fileCacheKey(file), blob, meta, savedAt: Date.now() });
            tx.oncomplete = () => resolve();
            tx.onerror = () => resolve();
          });
          const all = await new Promise(resolve => {
            const rq = db.transaction("sheets", "readonly").objectStore("sheets").getAll();
            rq.onsuccess = () => resolve(rq.result || []);
            rq.onerror = () => resolve([]);
          });
          if (all.length > SHEET_CACHE_MAX) {
            const excess = all.slice().sort((a, b) => a.savedAt - b.savedAt).slice(0, all.length - SHEET_CACHE_MAX);
            const tx = db.transaction("sheets", "readwrite");
            const store = tx.objectStore("sheets");
            for (const rec of excess) store.delete(rec.key);
          }
        } catch (error) {
          console.warn("Sheet cache write failed", error);
        }
      }

      async function getContactSheet(item) {
        if (item.sheet) return item.sheet;
        const cached = await cacheGetSheet(item.file);
        if (cached) {
          item.meta = cached.meta;
          item.sheet = cached.dataUrl;
          return item.sheet;
        }
        const made = await createContactSheet(item);
        item.sheet = made.dataUrl;
        if (made.blob) {
          cachePutSheet(item.file, made.blob, item.meta);
        }
        return item.sheet;
      }

      const picker = {
        candidates: [],
        selected: [],
        queue: [],
        processing: false,
        observer: null
      };

      function isPickerOpen() {
        return !els.picker.hidden;
      }

      function openPicker(fileList) {
        closePicker();
        const videos = Array.from(fileList)
          .filter(file => file.type.startsWith("video/") || /\.mp4$/i.test(file.name))
          .sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name, "ja"));
        if (!videos.length) {
          setStatus("フォルダ内に動画ファイルがありませんでした。", true);
          return;
        }
        picker.candidates = videos.map(file => ({
          file,
          name: file.name,
          relPath: file.webkitRelativePath || file.name,
          url: URL.createObjectURL(file),
          thumb: "",
          thumbError: false,
          sheet: "",
          sheetError: false,
          meta: null,
          queued: false,
          loadError: ""
        }));
        picker.selected = [];
        els.picker.hidden = false;
        renderPicker();
        setupPickerObserver();
        updatePickerStatus();
      }

      function closePicker() {
        if (picker.observer) {
          picker.observer.disconnect();
          picker.observer = null;
        }
        for (const cand of picker.candidates) {
          URL.revokeObjectURL(cand.url);
        }
        picker.candidates = [];
        picker.selected = [];
        picker.queue = [];
        els.picker.hidden = true;
        els.pickerGrid.innerHTML = "";
      }

      function renderPicker() {
        els.pickerGrid.innerHTML = picker.candidates.map((cand, i) => {
          const order = picker.selected.indexOf(cand);
          return `
          <div class="pick-card ${order >= 0 ? "selected" : ""}" data-i="${i}">
            ${order >= 0 ? `<span class="pick-order">${order + 1}</span>` : ""}
            ${cand.sheet ? `<img class="sheet" src="${cand.sheet}" alt="">` : `<span class="thumb-fallback" style="width:100%;height:120px">${cand.sheetError ? "プレビュー生成失敗" : "プレビュー生成待ち"}</span>`}
            <span class="pick-name" title="${escapeHtml(cand.relPath)}">${escapeHtml(cand.name)}</span>
            <span class="pick-note">${cand.meta ? `${formatClock(cand.meta.duration)} ・ ${cand.meta.width}x${cand.meta.height}` : escapeHtml(cand.relPath)}</span>
            <button type="button" class="pick-expand" data-i="${i}">拡大</button>
          </div>`;
        }).join("");
        els.pickerGrid.querySelectorAll(".pick-card").forEach(card => {
          card.addEventListener("click", event => {
            if (event.target.closest(".pick-expand")) return;
            togglePick(Number(card.dataset.i));
          });
        });
        els.pickerGrid.querySelectorAll(".pick-expand").forEach(btn => {
          btn.addEventListener("click", () => {
            openSheetView(picker.candidates, Number(btn.dataset.i), "picker");
          });
        });
        if (picker.observer) {
          els.pickerGrid.querySelectorAll(".pick-card").forEach(card => picker.observer.observe(card));
        }
      }

      function setupPickerObserver() {
        if (picker.observer) picker.observer.disconnect();
        picker.observer = new IntersectionObserver(entries => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            const cand = picker.candidates[Number(entry.target.dataset.i)];
            if (cand && !cand.sheet && !cand.sheetError && !cand.queued) {
              cand.queued = true;
              picker.queue.push(cand);
              processPickerQueue();
            }
          }
        }, { root: els.pickerGrid, rootMargin: "240px" });
        els.pickerGrid.querySelectorAll(".pick-card").forEach(card => picker.observer.observe(card));
      }

      async function processPickerQueue() {
        if (picker.processing) return;
        picker.processing = true;
        while (picker.queue.length) {
          const cand = picker.queue.shift();
          if (!picker.candidates.includes(cand) || cand.sheet || cand.sheetError) continue;
          try {
            await getContactSheet(cand);
          } catch (error) {
            cand.sheetError = true;
            console.warn("Picker sheet failed", cand.name, error);
          }
          if (isPickerOpen()) renderPicker();
        }
        picker.processing = false;
      }

      function togglePick(i) {
        const cand = picker.candidates[i];
        if (!cand) return;
        const at = picker.selected.indexOf(cand);
        if (at >= 0) {
          picker.selected.splice(at, 1);
        } else {
          picker.selected.push(cand);
        }
        renderPicker();
        updatePickerStatus();
      }

      function updatePickerStatus() {
        els.pickerStatus.textContent = `動画 ${picker.candidates.length} 件中 ${picker.selected.length} 件を選択中（クリックした順に登録されます）`;
        els.pickerRegister.textContent = `選択した動画を登録（${picker.selected.length}件）`;
        els.pickerRegister.disabled = picker.selected.length === 0;
      }

      function registerPicked() {
        if (!picker.selected.length) return;
        const mode = state.files.length ? "append" : "replace";
        const slots = Math.max(0, 99 - (mode === "append" ? state.files.length : 0));
        const chosen = picker.selected.slice(0, slots);
        const items = chosen.map(cand => ({
          file: cand.file,
          index: 0,
          name: cand.name,
          url: cand.url,
          thumb: cand.thumb || "",
          thumbError: false,
          sheet: cand.sheet || "",
          sheetError: !!cand.sheetError,
          meta: cand.meta || null,
          loadError: ""
        }));
        for (const cand of picker.candidates) {
          if (!chosen.includes(cand)) {
            URL.revokeObjectURL(cand.url);
          }
        }
        if (picker.observer) {
          picker.observer.disconnect();
          picker.observer = null;
        }
        picker.candidates = [];
        picker.selected = [];
        picker.queue = [];
        els.picker.hidden = true;
        els.pickerGrid.innerHTML = "";
        applyLoadedItems(items, mode);
      }

      function createThumbnail(item) {
        return new Promise((resolve, reject) => {
          const video = document.createElement("video");
          const canvas = document.createElement("canvas");
          const timeout = window.setTimeout(() => cleanup(() => reject(new Error("timeout"))), 7000);

          video.muted = true;
          video.playsInline = true;
          video.preload = "metadata";
          video.src = item.url;

          function cleanup(done) {
            window.clearTimeout(timeout);
            video.onloadedmetadata = null;
            video.onloadeddata = null;
            video.onseeked = null;
            video.onerror = null;
            done();
          }

          video.onerror = () => cleanup(() => reject(new Error("load error")));
          video.onloadedmetadata = () => {
            const target = Number.isFinite(video.duration) && video.duration > .15 ? .1 : 0;
            if (target === 0 && video.readyState >= 2) {
              draw();
              return;
            }
            try {
              if (target > 0) {
                video.currentTime = target;
              }
            } catch (error) {
              draw();
            }
          };
          video.onloadeddata = () => {
            if (video.currentTime === 0) {
              draw();
            }
          };
          video.onseeked = draw;

          function draw() {
            cleanup(() => {
              const width = video.videoWidth || 160;
              const height = video.videoHeight || 90;
              canvas.width = 136;
              canvas.height = 136;
              const ctx = canvas.getContext("2d");
              ctx.fillStyle = "#111";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              const scale = Math.max(canvas.width / width, canvas.height / height);
              const drawWidth = width * scale;
              const drawHeight = height * scale;
              const x = (canvas.width - drawWidth) / 2;
              const y = (canvas.height - drawHeight) / 2;
              ctx.drawImage(video, x, y, drawWidth, drawHeight);
              resolve(canvas.toDataURL("image/jpeg", .82));
            });
          }
        });
      }

      function startLoop(key, restart = true) {
        const numericKey = Number(key);
        if (!state.files.length) {
          setStatus("先にMP4ファイルを選択してください。", true);
          return;
        }
        const parsed = parseLoop(numericKey);
        if (!parsed.steps.length) {
          setStatus(`キー${numericKey}のループ単位に有効な動画番号がありません。`, true);
          return;
        }
        state.activeLoop = numericKey;
        state.stepIndex = 0;
        saveSettings();
        render();
        playCurrent(restart);
      }

      async function playCurrent(restart = true) {
        const item = getCurrentFile();
        if (!item) {
          setStatus("再生できる動画がありません。", true);
          render();
          return;
        }

        els.emptyState.style.display = "none";
        if (els.player.src !== item.url) {
          els.player.src = item.url;
          resetPlayerSizing();
        }
        els.player.loop = false;
        if (restart) {
          try {
            els.player.currentTime = 0;
          } catch (error) {
            console.warn("Could not reset currentTime", error);
          }
        }
        try {
          await els.player.play();
          setStatus(`キー${state.activeLoop}を再生中。`);
        } catch (error) {
          setStatus("再生を開始できませんでした。カードまたはボタンをもう一度操作してください。", true);
        }
        render();
      }

      function updatePlayerFit() {
        const videoWidth = els.player.videoWidth;
        const videoHeight = els.player.videoHeight;
        const bounds = els.player.parentElement.getBoundingClientRect();
        const boxWidth = Math.floor(bounds.width);
        const boxHeight = Math.floor(bounds.height);
        if (!videoWidth || !videoHeight || !boxWidth || !boxHeight) return;

        const scale = Math.min(boxWidth / videoWidth, boxHeight / videoHeight);
        const displayWidth = Math.floor(videoWidth * scale);
        const displayHeight = Math.floor(videoHeight * scale);

        els.player.style.aspectRatio = `${videoWidth} / ${videoHeight}`;
        els.player.style.width = `${displayWidth}px`;
        els.player.style.height = `${displayHeight}px`;
      }

      function resetPlayerSizing() {
        els.player.style.removeProperty("width");
        els.player.style.removeProperty("height");
        els.player.style.removeProperty("aspect-ratio");
      }

      function schedulePlayerFit() {
        updatePlayerFit();
        requestAnimationFrame(updatePlayerFit);
        window.setTimeout(updatePlayerFit, 80);
      }

      function playNextStep() {
        if (!state.activeLoop) return;
        const { steps } = parseLoop(state.activeLoop);
        if (!steps.length) return;
        state.stepIndex = (state.stepIndex + 1) % steps.length;
        playCurrent(true);
      }

      function restartActiveLoop() {
        if (state.activeLoop) {
          startLoop(state.activeLoop, true);
        } else {
          setStatus("再生し直すループ単位を選択してください。", true);
        }
      }

      function updateLoop(key, value) {
        state.loops[key] = value.replace(/[^\d]/g, "").slice(0, 48);
        saveSettings();
        renderCards();
        renderNow();
      }

      function requestFullscreen() {
        const target = els.stage;
        if (!document.fullscreenElement && target.requestFullscreen) {
          target.requestFullscreen().catch(() => setStatus("フルスクリーンを開始できませんでした。", true));
        }
      }

      function exitFullscreen() {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
      }

      function toggleUi() {
        state.uiVisible = !state.uiVisible;
        saveSettings();
        render();
      }

      function resetOverlayIdle() {
        state.overlayIdle = false;
        window.clearTimeout(state.idleTimer);
        state.idleTimer = window.setTimeout(() => {
          if (document.fullscreenElement) {
            state.overlayIdle = true;
            renderOverlayVisibility();
          }
        }, 2600);
        renderOverlayVisibility();
      }

      function renderOverlayVisibility() {
        els.overlay.classList.toggle("hidden", !state.uiVisible);
        els.overlay.classList.toggle("idle", state.overlayIdle && state.uiVisible);
      }

      function render() {
        renderFiles();
        renderEditors();
        renderCards();
        renderNow();
        renderOverlayVisibility();
      }

      function renderFiles() {
        if (!state.files.length) {
          els.fileList.innerHTML = '<li class="status">未選択</li>';
          return;
        }
        els.fileList.innerHTML = state.files.map(item => `
          <li class="file-row">
            <span class="num">${item.index}</span>
            ${renderThumb(item, "thumb")}
            <div class="file-meta">
              <div class="file-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
              <div class="file-note">${escapeHtml(fileNote(item))}</div>
            </div>
            <button type="button" class="remove-file" data-index="${item.index - 1}" title="登録解除" aria-label="${escapeHtml(item.name)} の登録解除">×</button>
            ${item.sheet ? `<img class="sheet" src="${item.sheet}" data-index="${item.index - 1}" alt="${escapeHtml(item.name)} のプレビュー" title="クリックで拡大">` : ""}
          </li>
        `).join("");
        els.fileList.querySelectorAll(".remove-file").forEach(button => {
          button.addEventListener("click", () => removeFile(Number(button.dataset.index)));
        });
        els.fileList.querySelectorAll(".sheet").forEach(img => {
          img.addEventListener("click", () => openSheetView(state.files, Number(img.dataset.index), "files"));
        });
      }

      function fileNote(item) {
        if (item.thumbError && item.sheetError) return "サムネイル生成失敗";
        if (item.meta) return `${formatClock(item.meta.duration)} ・ ${item.meta.width}x${item.meta.height}`;
        if (item.sheetError) return "プレビュー生成失敗";
        return "プレビュー生成中…";
      }

      // 拡大表示の閲覧状態。list は表示対象の配列（登録済みファイル or ピッカー候補）、
      // context は "files" | "picker"。左右キーで前後の動画へ移動し、
      // ピッカーでは Space で選択/解除できる。
      const sheetView = { list: [], index: -1, context: "" };

      function openSheetView(list, index, context) {
        if (!list.length) return;
        sheetView.list = list;
        sheetView.context = context;
        els.sheetModal.hidden = false;
        showSheetAt(index);
      }

      async function showSheetAt(index) {
        const n = sheetView.list.length;
        if (!n) return;
        sheetView.index = ((index % n) + n) % n;
        const item = sheetView.list[sheetView.index];
        renderSheetModal();
        if (!item.sheet && !item.sheetError) {
          try {
            await getContactSheet(item);
          } catch (error) {
            item.sheetError = true;
          }
          if (isSheetModalOpen() && sheetView.list[sheetView.index] === item) {
            renderSheetModal();
          }
          if (sheetView.context === "picker" && isPickerOpen()) renderPicker();
          if (sheetView.context === "files") renderFileList();
        }
        prefetchSheet(sheetView.index + 1);
        prefetchSheet(sheetView.index - 1);
      }

      function prefetchSheet(index) {
        const n = sheetView.list.length;
        if (!n) return;
        const item = sheetView.list[((index % n) + n) % n];
        if (item && !item.sheet && !item.sheetError) {
          getContactSheet(item).catch(() => {
            item.sheetError = true;
          });
        }
      }

      function renderSheetModal() {
        const item = sheetView.list[sheetView.index];
        if (!item) return;
        if (item.sheet) {
          els.sheetModalImg.src = item.sheet;
          els.sheetModalImg.style.display = "";
        } else {
          els.sheetModalImg.removeAttribute("src");
          els.sheetModalImg.style.display = "none";
        }
        let caption = `${item.name}（${sheetView.index + 1} / ${sheetView.list.length}）`;
        if (sheetView.context === "picker") {
          const order = picker.selected.indexOf(item);
          caption += order >= 0 ? ` ・ 選択中（${order + 1}番目に登録）` : " ・ 未選択";
        }
        if (!item.sheet) {
          caption += item.sheetError ? " ・ プレビュー生成失敗" : " ・ プレビュー生成中…";
        }
        els.sheetModalCaption.textContent = caption;
      }

      function stepSheet(delta) {
        showSheetAt(sheetView.index + delta);
      }

      function toggleSheetSelection() {
        if (sheetView.context !== "picker") return;
        const item = sheetView.list[sheetView.index];
        if (!item) return;
        const at = picker.selected.indexOf(item);
        if (at >= 0) {
          picker.selected.splice(at, 1);
        } else {
          picker.selected.push(item);
        }
        renderSheetModal();
        renderPicker();
        updatePickerStatus();
      }

      function closeSheetModal() {
        els.sheetModal.hidden = true;
        els.sheetModalImg.removeAttribute("src");
        sheetView.list = [];
        sheetView.index = -1;
        sheetView.context = "";
      }

      function isSheetModalOpen() {
        return !els.sheetModal.hidden;
      }

      function renderEditors() {
        els.loopEditors.innerHTML = "";
        for (let key = 1; key <= 9; key++) {
          const row = document.createElement("div");
          row.className = "loop-edit-row";
          row.innerHTML = `
            <label for="loop-${key}">キー${key}</label>
            <input id="loop-${key}" inputmode="numeric" autocomplete="off" value="${escapeHtml(state.loops[key] || "")}" aria-label="キー${key}のループ単位">
          `;
          const input = row.querySelector("input");
          input.addEventListener("input", () => updateLoop(key, input.value));
          els.loopEditors.appendChild(row);
        }
      }

      function renderCards() {
        const html = Array.from({ length: 9 }, (_, index) => renderLoopCard(index + 1, false)).join("");
        const compactHtml = Array.from({ length: 9 }, (_, index) => renderLoopCard(index + 1, true)).join("");
        els.cards.innerHTML = html;
        els.overlayCards.innerHTML = compactHtml;
        bindCardClicks(els.cards);
        bindCardClicks(els.overlayCards);
      }

      function bindCardClicks(root) {
        root.querySelectorAll(".loop-card").forEach(card => {
          card.addEventListener("click", () => {
            if (!card.classList.contains("disabled")) {
              startLoop(Number(card.dataset.key), true);
            }
          });
        });
      }

      function renderLoopCard(key, compact) {
        const { raw, steps } = parseLoop(key);
        const active = state.activeLoop === key;
        const disabled = steps.length === 0;
        const stepLabel = steps.length ? steps.join(" / ") : "有効な動画なし";
        const status = steps.length ? `${steps.length} steps` : "無効";
        const classes = ["loop-card", compact ? "compact" : "", active ? "active" : "", disabled ? "disabled" : ""].filter(Boolean).join(" ");
        return `
          <button type="button" class="${classes}" data-key="${key}" ${disabled ? "disabled" : ""}>
            ${renderLoopThumbs(steps)}
            <span class="loop-info">
              <span class="loop-key">キー${key}</span>
              <span class="loop-spec" title="${escapeHtml(raw || "(空)") }">${escapeHtml(raw || "(空)")}</span>
              <span class="loop-steps" title="${escapeHtml(stepLabel)}">${escapeHtml(stepLabel)}</span>
              <span class="loop-state">${status}</span>
            </span>
          </button>
        `;
      }

      function renderLoopThumbs(steps) {
        if (!steps.length) {
          return '<span class="thumb-fallback">no<br>loop</span>';
        }
        if (steps.length === 1) {
          return renderThumb(state.files[steps[0] - 1], "thumb");
        }
        const visible = steps.slice(0, 4);
        return `
          <span class="thumb-stack">
            ${visible.map(step => renderMiniThumb(state.files[step - 1], step)).join("")}
          </span>
        `;
      }

      function renderThumb(item, className) {
        if (item && item.thumb) {
          return `<img class="${className}" src="${item.thumb}" alt="${escapeHtml(item.index + ': ' + item.name)}">`;
        }
        const label = item ? `${item.index}<br>${escapeHtml(shortName(item.name))}` : "no<br>file";
        return `<span class="thumb-fallback">${label}</span>`;
      }

      function renderMiniThumb(item, step) {
        if (item && item.thumb) {
          return `<img class="mini-thumb" src="${item.thumb}" alt="動画${step}">`;
        }
        return `<span class="mini-thumb mini-fallback">${step}</span>`;
      }

      function renderNow() {
        const item = getCurrentFile();
        if (!item) {
          els.nowPlaying.textContent = "現在再生中: なし";
          els.nowLoop.textContent = state.activeLoop ? `ループ: キー${state.activeLoop}` : "ループ: なし";
          return;
        }
        const { raw, steps } = parseLoop(state.activeLoop);
        const videoNumber = steps[state.stepIndex];
        els.nowPlaying.textContent = `現在再生中: ${videoNumber}: ${item.name}`;
        els.nowLoop.textContent = `ループ: キー${state.activeLoop} (${raw}) step ${state.stepIndex + 1}/${steps.length}`;
      }

      function getKeyNumber(event) {
        if (/^Digit[1-9]$/.test(event.code)) return Number(event.code.replace("Digit", ""));
        if (/^Numpad[1-9]$/.test(event.code)) return Number(event.code.replace("Numpad", ""));
        if (/^[1-9]$/.test(event.key)) return Number(event.key);
        return null;
      }

      function isEditingText(event) {
        const tag = event.target && event.target.tagName;
        return tag === "INPUT" || tag === "TEXTAREA" || event.target.isContentEditable;
      }

      function onKeyDown(event) {
        if (isSheetModalOpen()) {
          if (event.key === "Escape") {
            event.preventDefault();
            closeSheetModal();
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            stepSheet(1);
          } else if (event.key === "ArrowLeft") {
            event.preventDefault();
            stepSheet(-1);
          } else if (event.code === "Space" || event.key === " ") {
            event.preventDefault();
            toggleSheetSelection();
          }
          return;
        }
        if (isPickerOpen()) {
          if (event.key === "Escape") {
            event.preventDefault();
            closePicker();
          }
          return;
        }
        const number = getKeyNumber(event);
        const editing = isEditingText(event);
        if (number && (!editing || document.fullscreenElement)) {
          event.preventDefault();
          startLoop(number, true);
          return;
        }

        if (editing && !document.fullscreenElement) return;

        if (event.key === "Enter") {
          event.preventDefault();
          requestFullscreen();
        } else if (event.key === "Escape") {
          exitFullscreen();
        } else if (event.key.toLowerCase() === "h") {
          event.preventDefault();
          toggleUi();
        } else if (event.key.toLowerCase() === "r" || event.key === "0" || event.code === "Numpad0" || event.code === "Digit0") {
          event.preventDefault();
          restartActiveLoop();
        }
      }

      function shortName(name) {
        return name.length > 10 ? name.slice(0, 8) + "..." : name;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function setupEvents() {
        els.fileInput.addEventListener("change", event => {
          acceptFiles(event.target.files, "replace");
          event.target.value = "";
        });
        els.appendInput.addEventListener("change", event => {
          acceptFiles(event.target.files, "append");
          event.target.value = "";
        });
        els.appendButton.addEventListener("click", () => els.appendInput.click());
        els.folderButton.addEventListener("click", () => els.folderInput.click());
        els.folderInput.addEventListener("change", event => {
          openPicker(event.target.files);
          event.target.value = "";
        });
        els.pickerSelectAll.addEventListener("click", () => {
          picker.selected = picker.candidates.slice();
          renderPicker();
          updatePickerStatus();
        });
        els.pickerClear.addEventListener("click", () => {
          picker.selected = [];
          renderPicker();
          updatePickerStatus();
        });
        els.pickerRegister.addEventListener("click", registerPicked);
        els.pickerCancel.addEventListener("click", () => closePicker());
        els.sheetModal.addEventListener("click", closeSheetModal);
        els.clearFilesButton.addEventListener("click", clearFiles);
        els.fullscreenButton.addEventListener("click", requestFullscreen);
        els.restartButton.addEventListener("click", restartActiveLoop);
        els.toggleUiButton.addEventListener("click", toggleUi);
        els.player.addEventListener("loadedmetadata", schedulePlayerFit);
        els.player.addEventListener("ended", playNextStep);
        els.player.addEventListener("error", () => {
          const item = getCurrentFile();
          if (item) {
            item.loadError = "読み込み失敗";
            setStatus(`${item.name} を読み込めませんでした。`, true);
          }
        });
        document.addEventListener("keydown", onKeyDown);
        document.addEventListener("fullscreenchange", () => {
          resetOverlayIdle();
          schedulePlayerFit();
        });
        window.addEventListener("resize", schedulePlayerFit);
        els.stage.addEventListener("mousemove", resetOverlayIdle);
        els.stage.addEventListener("click", resetOverlayIdle);

        document.addEventListener("dragover", event => {
          event.preventDefault();
          els.app.classList.add("drop-target");
        });
        document.addEventListener("dragleave", () => els.app.classList.remove("drop-target"));
        document.addEventListener("drop", event => {
          event.preventDefault();
          els.app.classList.remove("drop-target");
          if (event.dataTransfer && event.dataTransfer.files.length) {
            acceptFiles(event.dataTransfer.files, state.files.length ? "append" : "replace");
          }
        });

        window.addEventListener("beforeunload", revokeFiles);
      }

      loadSettings();
      setupEvents();
      render();
      resetOverlayIdle();
    })();
  </script>
</body>
</html>
