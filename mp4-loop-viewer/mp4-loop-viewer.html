              <span class="loop-spec" title="${escapeHtml(raw || "(空)") }">${escapeHtml(raw || "(空)")}</span>
              <span class="loop-steps" title="${escapeHtml(stepLabel)}">${escapeHtml(stepLabel)}</span>
              <span class="loop-state">${status}</span>
            </span>
          </button>
        `;
      }

      function renderLoopThumbs(steps) {
        if (!steps.length) {
          return '<span class="thumb-fallback">no<br>loop</span>';
        }
        if (steps.length === 1) {
          return renderThumb(state.files[steps[0] - 1], "thumb");
        }
        const visible = steps.slice(0, 4);
        return `
          <span class="thumb-stack">
            ${visible.map(step => renderMiniThumb(state.files[step - 1], step)).join("")}
          </span>
        `;
      }

      function renderThumb(item, className) {
        if (item && item.thumb) {
          return `<img class="${className}" src="${item.thumb}" alt="${escapeHtml(item.index + ': ' + item.name)}">`;
        }
        const label = item ? `${item.index}<br>${escapeHtml(shortName(item.name))}` : "no<br>file";
        return `<span class="thumb-fallback">${label}</span>`;
      }

      function renderMiniThumb(item, step) {
        if (item && item.thumb) {
          return `<img class="mini-thumb" src="${item.thumb}" alt="動画${step}">`;
        }
        return `<span class="mini-thumb mini-fallback">${step}</span>`;
      }

      function renderNow() {
        const item = getCurrentFile();
        if (!item) {
          els.nowPlaying.textContent = "現在再生中: なし";
          els.nowLoop.textContent = state.activeLoop ? `ループ: キー${state.activeLoop}` : "ループ: なし";
          return;
        }
        const { raw, steps } = parseLoop(state.activeLoop);
        const videoNumber = steps[state.stepIndex];
        els.nowPlaying.textContent = `現在再生中: ${videoNumber}: ${displayName(item)}`;
        els.nowLoop.textContent = `ループ: キー${state.activeLoop} (${raw}) step ${state.stepIndex + 1}/${steps.length}`;
      }

      function getKeyNumber(event) {
        if (/^Digit[1-9]$/.test(event.code)) return Number(event.code.replace("Digit", ""));
        if (/^Numpad[1-9]$/.test(event.code)) return Number(event.code.replace("Numpad", ""));
        if (/^[1-9]$/.test(event.key)) return Number(event.key);
        return null;
      }

      function isEditingText(event) {
        const tag = event.target && event.target.tagName;
        return tag === "INPUT" || tag === "TEXTAREA" || event.target.isContentEditable;
      }

      function onKeyDown(event) {
        if (isSheetModalOpen()) {
          if (event.key === "Escape") {
            event.preventDefault();
            closeSheetModal();
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            stepSheet(1);
          } else if (event.key === "ArrowLeft") {
            event.preventDefault();
            stepSheet(-1);
          } else if (event.code === "Space" || event.key === " ") {
            event.preventDefault();
            toggleSheetSelection();
          }
          return;
        }
        if (isPickerOpen()) {
          if (event.key === "Escape") {
            event.preventDefault();
            closePicker();
          }
          return;
        }
        const number = getKeyNumber(event);
        const editing = isEditingText(event);
        if (number && (!editing || document.fullscreenElement)) {
          event.preventDefault();
          startLoop(number, true);
          return;
        }

        if (editing && !document.fullscreenElement) return;

        if (event.key === "Enter") {
          event.preventDefault();
          requestFullscreen();
        } else if (event.key === "Escape") {
          exitFullscreen();
        } else if (event.code === "Space" || event.key === " ") {
          event.preventDefault();
          togglePlayPause();
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          stepFrame(1);
        } else if (event.key === "ArrowLeft") {
          event.preventDefault();
          stepFrame(-1);
        } else if (event.key.toLowerCase() === "c" && !event.ctrlKey && !event.metaKey && !event.altKey) {
          event.preventDefault();
          addCutMarkAtCurrentTime();
        } else if (event.key.toLowerCase() === "h") {
          event.preventDefault();
          toggleUi();
        } else if (event.key.toLowerCase() === "r" || event.key === "0" || event.code === "Numpad0" || event.code === "Digit0") {
          event.preventDefault();
          restartActiveLoop();
        }
      }

      function shortName(name) {
        return name.length > 10 ? name.slice(0, 8) + "..." : name;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function setupEvents() {
        els.fileInput.addEventListener("change", event => {
          acceptFiles(event.target.files, "replace");
          event.target.value = "";
        });
        els.appendInput.addEventListener("change", event => {
          acceptFiles(event.target.files, "append");
          event.target.value = "";
        });
        els.appendButton.addEventListener("click", () => els.appendInput.click());
        els.folderButton.addEventListener("click", () => {
          if (window.showDirectoryPicker) {
            openFolderViaHandle();
          } else {
            els.folderInput.click();
          }
        });
        els.folderInput.addEventListener("change", event => {
          openPicker(event.target.files);
          event.target.value = "";
        });
        els.pickerSelectAll.addEventListener("click", () => {
          picker.selected = picker.candidates.slice();
          renderPicker();
          updatePickerStatus();
        });
        els.pickerClear.addEventListener("click", () => {
          picker.selected = [];
          renderPicker();
          updatePickerStatus();
        });
        els.pickerRegister.addEventListener("click", registerPicked);
        els.pickerCancel.addEventListener("click", () => closePicker());
        els.sheetModal.addEventListener("click", closeSheetModal);
        els.clearFilesButton.addEventListener("click", clearFiles);
        els.fullscreenButton.addEventListener("click", requestFullscreen);
        els.restartButton.addEventListener("click", restartActiveLoop);
        els.toggleUiButton.addEventListener("click", toggleUi);
        els.player.addEventListener("loadedmetadata", schedulePlayerFit);
        els.player.addEventListener("ended", playNextStep);
        window.setInterval(() => {
          const item = getCurrentFile();
          if (!item || item.segEnd == null) return;
          if (els.player.paused || els.player.ended) return;
          const dur = els.player.duration;
          if (Number.isFinite(dur) && item.segEnd >= dur - .05) return;
          if (els.player.currentTime >= item.segEnd - .01) playNextStep();
        }, 50);
        els.player.addEventListener("error", () => {
          const item = getCurrentFile();
          if (item) {
            item.loadError = "読み込み失敗";
            setStatus(`${item.name} を読み込めませんでした。`, true);
          }
        });
        document.addEventListener("keydown", onKeyDown);
        document.addEventListener("fullscreenchange", () => {
          resetOverlayIdle();
          schedulePlayerFit();
        });
        window.addEventListener("resize", schedulePlayerFit);
        els.stage.addEventListener("mousemove", resetOverlayIdle);
        els.stage.addEventListener("click", resetOverlayIdle);

        let rotateDrag = null;

        function pointerAngleDeg(event, center) {
          return Math.atan2(event.clientY - center.y, event.clientX - center.x) * 180 / Math.PI;
        }

        els.videoWrap.addEventListener("pointerdown", event => {
          if (event.button !== 0 || !getCurrentFile()) return;
          const rect = els.videoWrap.getBoundingClientRect();
          const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
          if (Math.hypot(event.clientX - center.x, event.clientY - center.y) < 24) return;
          rotateDrag = {
            id: event.pointerId,
            center,
            startPointer: pointerAngleDeg(event, center),
            startRotation: state.rotation || 0
          };
          els.videoWrap.setPointerCapture(event.pointerId);
          els.videoWrap.classList.add("rotating");
          event.preventDefault();
        });

        els.videoWrap.addEventListener("pointermove", event => {
          if (!rotateDrag || event.pointerId !== rotateDrag.id) return;
          const center = rotateDrag.center;
          if (Math.hypot(event.clientX - center.x, event.clientY - center.y) < 12) return;
          let delta = pointerAngleDeg(event, center) - rotateDrag.startPointer;
          if (event.shiftKey) delta *= 0.15;
          let deg = rotateDrag.startRotation + delta;
          deg = ((deg + 180) % 360 + 360) % 360 - 180;
          const snapped = Math.round(deg / 90) * 90;
          if (Math.abs(deg - snapped) <= 3) deg = snapped;
          state.rotation = Math.round(deg * 10) / 10;
          applyRotation();
          setStatus(`回転 ${state.rotation.toFixed(1)}°（ドラッグで調整、Shiftで微調整、ホイールで縮小／拡大、ダブルクリックでリセット）`);
        });

        function endRotateDrag(event) {
          if (!rotateDrag || event.pointerId !== rotateDrag.id) return;
          rotateDrag = null;
          els.videoWrap.classList.remove("rotating");
          persistRotation();
          setStatus(state.rotation ? `回転 ${state.rotation.toFixed(1)}°で固定しました。` : "回転をリセットしました。");
        }

        els.videoWrap.addEventListener("pointerup", endRotateDrag);
        els.videoWrap.addEventListener("pointercancel", endRotateDrag);

        els.videoWrap.addEventListener("wheel", event => {
          if (!getCurrentFile()) return;
          event.preventDefault();
          const { zoom, minZoom } = effectiveZoom();
          const next = Math.min(2, Math.max(minZoom, zoom * Math.exp(-event.deltaY * 0.0015)));
          state.zoom = Math.round(next * 1000) / 1000;
          applyRotation();
          persistRotation();
          setStatus(`回転 ${(state.rotation || 0).toFixed(1)}° / ズーム ${Math.round(state.zoom * 100)}%（100%＝自動拡大、最小で四隅まで表示）`);
        }, { passive: false });

        els.videoWrap.addEventListener("dblclick", () => {
          if (!getCurrentFile()) return;
          state.rotation = 0;
          state.zoom = 1;
          applyRotation();
          persistRotation();
          setStatus("回転とズームをリセットしました。");
        });

        document.addEventListener("dragover", event => {
          event.preventDefault();
          els.app.classList.add("drop-target");
        });
        document.addEventListener("dragleave", () => els.app.classList.remove("drop-target"));
        document.addEventListener("drop", event => {
          event.preventDefault();
          els.app.classList.remove("drop-target");
          if (event.dataTransfer && event.dataTransfer.files.length) {
            acceptFiles(event.dataTransfer.files, state.files.length ? "append" : "replace");
          }
        });

        window.addEventListener("beforeunload", revokeFiles);
      }

      loadSettings();
      setupEvents();
      render();
      resetOverlayIdle();
    })();
  </script>
</body>
</html>
