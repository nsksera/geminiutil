<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover を追加してセーフエリアに対応 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>お買い物サポーター</title>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* モバイルでのタップハイライトを消す */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        /* スクロールバーを隠す */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 数値入力のスピンボタンを消す */
        input[type="number"]::-webkit-outer-spin-button, 
        input[type="number"]::-webkit-inner-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        } 
        input[type="number"] { 
            -moz-appearance:textfield; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-[100dvh] w-screen overflow-hidden select-none">

    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVGアイコンコンポーネント
        const Icons = {
            Trash2: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/></svg>,
            ShoppingCart: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
            RefreshCw: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Edit2: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Percent: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
        };

        const App = () => {
            // --- State Management ---
            const [budget, setBudget] = useState(3000);
            const [isBudgetEditing, setIsBudgetEditing] = useState(false);
            
            // 入力フォームの状態
            const [price, setPrice] = useState('');
            const [taxType, setTaxType] = useState('excluded'); // 'excluded' (税抜) or 'included' (税込)
            const [taxRate, setTaxRate] = useState(0.08); // 0.08 or 0.10
            const [quantity, setQuantity] = useState(1);
            const [memo, setMemo] = useState('');
            const [discountRate, setDiscountRate] = useState(0); // 割引率 (%)
            
            const [editingId, setEditingId] = useState(null);
            const [items, setItems] = useState([]);
            const [isLoaded, setIsLoaded] = useState(false);

            // --- Effects (LocalStorage) ---
            useEffect(() => {
                const savedData = localStorage.getItem('shopping-app-data-v1');
                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        if (parsed.budget !== undefined) setBudget(parsed.budget);
                        if (parsed.items) setItems(parsed.items);
                    } catch (e) {
                        console.error("データの読み込みに失敗しました", e);
                    }
                }
                setIsLoaded(true);
            }, []);

            useEffect(() => {
                if (!isLoaded) return;
                const dataToSave = { budget, items };
                localStorage.setItem('shopping-app-data-v1', JSON.stringify(dataToSave));
            }, [budget, items, isLoaded]);

            // --- Logic ---
            const totalAmount = items.reduce((sum, item) => sum + item.subtotal, 0);
            const remainingBudget = (budget || 0) - totalAmount;
            const isOverBudget = remainingBudget < 0;

            const addOrUpdateItem = () => {
                if (!price || isNaN(price)) return;
                const unitPrice = parseFloat(price);
                
                // 1. 割引計算 (予算管理用なので端数は切り上げて高めに見積もる)
                const discountedPrice = Math.ceil(unitPrice * (1 - discountRate / 100));

                let finalPricePerItem = 0;
                if (taxType === 'excluded') {
                    // 税抜き: 割引後価格 * (1 + 税率) -> 切り上げ
                    finalPricePerItem = Math.ceil(discountedPrice * (1 + taxRate));
                } else {
                    // 税込み: 割引後価格そのもの
                    finalPricePerItem = Math.ceil(discountedPrice);
                }

                const commonData = {
                    memo: memo,
                    inputPrice: unitPrice, // 元値
                    discountRate: discountRate, // 割引率
                    taxType: taxType,
                    taxRate: taxType === 'excluded' ? taxRate : null,
                    quantity: quantity,
                    subtotal: finalPricePerItem * quantity
                };

                if (editingId) {
                    setItems(items.map(item => 
                        item.id === editingId ? { ...item, ...commonData } : item
                    ));
                    setEditingId(null);
                } else {
                    const newItem = {
                        id: Date.now(),
                        ...commonData
                    };
                    setItems([...items, newItem]);
                }

                // リセット
                setPrice('');
                setMemo('');
                setQuantity(1);
                setDiscountRate(0);
            };

            const startEditing = (item) => {
                setEditingId(item.id);
                setPrice(item.inputPrice.toString());
                setMemo(item.memo);
                setTaxType(item.taxType);
                if (item.taxRate) setTaxRate(item.taxRate);
                setQuantity(item.quantity);
                setDiscountRate(item.discountRate || 0);
            };

            const cancelEditing = () => {
                setEditingId(null);
                setPrice('');
                setMemo('');
                setQuantity(1);
                setDiscountRate(0);
            };

            const deleteItem = (id) => {
                if (editingId === id) cancelEditing();
                setItems(items.filter(item => item.id !== id));
            };

            const resetAll = () => {
                if (window.confirm('買い物リストをすべて消去しますか？\n（予算設定は残ります）')) {
                    setItems([]);
                    cancelEditing();
                }
            };

            const fmt = (num) => num ? num.toLocaleString() : '0';

            // --- Render Components ---
            if (!isLoaded) return null;

            return (
                <div class="flex flex-col h-full bg-gray-100 max-w-md mx-auto shadow-2xl overflow-hidden relative">
                    
                    {/* Header */}
                    <div class={`p-4 transition-colors duration-300 flex-shrink-0 ${isOverBudget ? 'bg-red-600' : 'bg-blue-600'} text-white shadow-md z-10`}>
                        <div class="flex justify-between items-start mb-2">
                            <h1 class="font-bold text-lg flex items-center gap-2">
                                <Icons.ShoppingCart /> 
                                {isOverBudget ? '予算オーバー！' : '買い物中'}
                            </h1>
                            <button onClick={resetAll} class="text-xs bg-white/20 hover:bg-white/30 px-2 py-1 rounded flex items-center gap-1 transition">
                                <Icons.RefreshCw /> リセット
                            </button>
                        </div>

                        <div class="flex justify-between items-end">
                            <div class="flex-1">
                                <div class="text-xs opacity-90 mb-1">現在の合計</div>
                                <div class="text-4xl font-bold tracking-tight">¥{fmt(totalAmount)}</div>
                            </div>
                            
                            <div class="text-right flex flex-col items-end">
                                <div class="flex items-center justify-end mb-1 h-10">
                                    <span class="text-sm opacity-90 mr-2">予算</span>
                                    {isBudgetEditing ? (
                                        <input 
                                            type="number"
                                            inputMode="numeric" 
                                            pattern="[0-9]*"
                                            class="w-28 text-gray-800 px-2 py-1 rounded-md text-right text-xl font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-300"
                                            value={budget}
                                            onChange={(e) => setBudget(e.target.value === '' ? '' : parseInt(e.target.value))}
                                            onBlur={() => { if(budget === '') setBudget(0); setIsBudgetEditing(false); }}
                                            onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
                                            autoFocus
                                        />
                                    ) : (
                                        <button 
                                            onClick={() => setIsBudgetEditing(true)} 
                                            class="flex items-center gap-1 text-xl font-bold border-b-2 border-white/50 hover:bg-white/10 hover:border-white px-2 py-0.5 rounded transition-all active:scale-95 bg-white/5"
                                        >
                                            ¥{fmt(budget)}
                                            <span class="opacity-70"><Icons.Edit /></span>
                                        </button>
                                    )}
                                </div>
                                <div class={`text-lg font-bold ${remainingBudget < 0 ? 'text-yellow-300' : 'text-white'}`}>
                                    残り ¥{fmt(remainingBudget)}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* List Area */}
                    <div class="flex-1 overflow-y-auto p-3 pb-52 no-scrollbar space-y-2 w-full">
                        {items.length === 0 ? (
                            <div class="h-full flex flex-col items-center justify-center text-gray-400 opacity-60 mt-10">
                                <Icons.ShoppingCart />
                                <p class="mt-2 text-sm">商品を追加してください</p>
                            </div>
                        ) : (
                            items.map(item => {
                                const isEditingThis = editingId === item.id;
                                return (
                                    <div key={item.id} class={`bg-white p-3 rounded-lg shadow-sm border flex justify-between items-center animate-[fadeIn_0.2s_ease-out] transition-colors ${isEditingThis ? 'border-blue-400 ring-1 ring-blue-100 bg-blue-50' : 'border-gray-100'}`}>
                                        <div class="flex-1 min-w-0">
                                            {/* メイン: 金額表示 */}
                                            <div class="flex items-baseline gap-2">
                                                <span class="font-bold text-xl text-gray-800">¥{fmt(item.subtotal)}</span>
                                                <span class="text-xs text-gray-400">(税込)</span>
                                            </div>

                                            {/* サブ: 詳細内訳表示 */}
                                            <div class="text-xs text-gray-500 mt-1 leading-relaxed">
                                                <div class="flex flex-wrap items-center gap-x-1">
                                                    {/* 単価 */}
                                                    <span>@{fmt(item.inputPrice)}</span>
                                                    
                                                    {/* 割引表示 */}
                                                    {item.discountRate > 0 && (
                                                        <span class="text-red-500 font-bold bg-red-50 px-1 rounded">
                                                            -{item.discountRate}%
                                                        </span>
                                                    )}

                                                    {/* 税表示 */}
                                                    {item.taxType === 'excluded' ? (
                                                        <span>
                                                            <span class="text-gray-400">+</span>
                                                            <span class="bg-gray-100 px-1 rounded text-gray-600">税{Math.round(item.taxRate*100)}%</span>
                                                        </span>
                                                    ) : (
                                                        <span class="bg-gray-100 px-1 rounded text-gray-600">税込</span>
                                                    )}

                                                    {/* 個数 */}
                                                    <span class="text-gray-400">×</span>
                                                    <span class="font-bold text-gray-700">{item.quantity}</span>
                                                </div>

                                                {/* メモ */}
                                                {item.memo && (
                                                    <div class="text-gray-600 truncate mt-0.5 pl-0.5 border-l-2 border-gray-200">
                                                        {item.memo}
                                                    </div>
                                                )}
                                                {isEditingThis && <div class="text-blue-600 font-bold mt-0.5">編集中</div>}
                                            </div>
                                        </div>

                                        <div class="flex gap-1 flex-shrink-0 ml-2 self-start mt-1">
                                            <button onClick={() => startEditing(item)} class={`p-2 transition-colors active:scale-95 rounded-full ${isEditingThis ? 'text-blue-600 bg-blue-100' : 'text-gray-400 hover:text-blue-500 hover:bg-gray-50'}`}>
                                                <Icons.Edit2 />
                                            </button>
                                            <button onClick={() => deleteItem(item.id)} class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors active:scale-95">
                                                <Icons.Trash2 />
                                            </button>
                                        </div>
                                    </div>
                                );
                            }).reverse()
                        )}
                        <div class="h-10"></div>
                    </div>

                    {/* Input Area (Fixed Bottom) */}
                    <div class={`border-t p-3 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20 transition-colors duration-300 w-full ${editingId ? 'bg-amber-50 border-amber-200' : 'bg-white border-gray-200'}`}>
                        
                        {editingId && (
                            <div class="text-xs text-amber-600 font-bold mb-1 flex justify-between">
                                <span>修正モード</span>
                                <button onClick={cancelEditing} class="underline">キャンセル</button>
                            </div>
                        )}

                        {/* Row 1: 価格 & メモ */}
                        <div class="flex gap-2 mb-2">
                            <div class="flex-[3] relative">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 font-bold">¥</span>
                                <input 
                                    type="number" inputMode="numeric" pattern="[0-9]*" placeholder="0" 
                                    class="w-full bg-white border border-gray-300 rounded-lg py-2 pl-8 pr-3 text-lg font-bold focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    value={price} onChange={(e) => setPrice(e.target.value)}
                                />
                            </div>
                            <input 
                                type="text" placeholder="メモ" 
                                class="flex-[2] bg-white border border-gray-300 rounded-lg px-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 min-w-0"
                                value={memo} onChange={(e) => setMemo(e.target.value)}
                            />
                        </div>

                        {/* Row 2: 割引設定 */}
                        <div class="flex gap-1 mb-2 items-center overflow-x-auto no-scrollbar">
                            <span class="text-xs font-bold text-gray-500 mr-1 flex-shrink-0 flex items-center gap-0.5">
                                <Icons.Percent />引
                            </span>
                            {[5, 10, 15, 20].map(rate => (
                                <button 
                                    key={rate}
                                    onClick={() => setDiscountRate(discountRate === rate ? 0 : rate)}
                                    class={`px-3 py-1.5 rounded text-xs font-bold transition-all whitespace-nowrap border flex-1
                                        ${discountRate === rate ? 'bg-red-500 text-white border-red-500' : 'bg-white text-gray-600 border-gray-200'}`}
                                >
                                    {rate}%
                                </button>
                            ))}
                            <div class="relative flex items-center w-16 flex-shrink-0 ml-1">
                                <input 
                                    type="number" placeholder="0"
                                    class={`w-full text-right pr-4 pl-1 py-1 rounded border text-sm font-bold focus:outline-none focus:ring-1 focus:ring-red-500
                                        ${discountRate > 0 && ![5,10,15,20].includes(discountRate) ? 'border-red-500 text-red-500 bg-red-50' : 'border-gray-300'}`}
                                    value={discountRate || ''}
                                    onChange={(e) => setDiscountRate(parseInt(e.target.value) || 0)}
                                    onFocus={(e) => e.target.select()}
                                />
                                <span class="absolute right-1 text-xs text-gray-400">%</span>
                            </div>
                        </div>

                        {/* Row 3: 税・個数・追加 */}
                        <div class="flex gap-1 items-stretch h-10">
                            {/* 税設定 */}
                            <div class="flex flex-col gap-0.5 flex-shrink-0 w-24">
                                <div class="flex bg-gray-100 rounded p-0.5 h-full">
                                    <button onClick={() => setTaxType('excluded')} class={`flex-1 text-[10px] rounded font-bold transition-all ${taxType === 'excluded' ? 'bg-white shadow text-blue-600' : 'text-gray-400'}`}>税抜</button>
                                    <button onClick={() => setTaxType('included')} class={`flex-1 text-[10px] rounded font-bold transition-all ${taxType === 'included' ? 'bg-white shadow text-blue-600' : 'text-gray-400'}`}>税込</button>
                                </div>
                                <div class={`flex bg-gray-100 rounded p-0.5 h-full transition-opacity ${taxType === 'included' ? 'opacity-30 pointer-events-none' : 'opacity-100'}`}>
                                    <button onClick={() => setTaxRate(0.08)} class={`flex-1 text-[10px] rounded font-bold transition-all ${taxRate === 0.08 ? 'bg-white shadow text-green-600' : 'text-gray-400'}`}>8%</button>
                                    <button onClick={() => setTaxRate(0.10)} class={`flex-1 text-[10px] rounded font-bold transition-all ${taxRate === 0.10 ? 'bg-white shadow text-green-600' : 'text-gray-400'}`}>10%</button>
                                </div>
                            </div>

                            {/* 個数 */}
                            <div class="flex items-center bg-gray-100 rounded-lg px-0.5 w-20 justify-between flex-shrink-0">
                                <button class="p-1.5 text-gray-500 active:text-blue-600 active:scale-90 transition" onClick={() => setQuantity(Math.max(1, quantity - 1))}><Icons.Minus /></button>
                                <span class="font-bold text-base w-5 text-center">{quantity}</span>
                                <button class="p-1.5 text-gray-500 active:text-blue-600 active:scale-90 transition" onClick={() => setQuantity(quantity + 1)}><Icons.Plus /></button>
                            </div>

                            {/* ボタン */}
                            {editingId ? (
                                <div class="flex-1 flex gap-1 min-w-0">
                                    <button onClick={cancelEditing} class="w-10 bg-gray-200 hover:bg-gray-300 rounded-lg text-gray-600 flex items-center justify-center shadow-sm active:scale-95 transition-all"><Icons.X /></button>
                                    <button onClick={addOrUpdateItem} class="flex-1 rounded-lg font-bold text-white flex items-center justify-center gap-1 shadow-sm active:scale-95 transition-all bg-green-600 hover:bg-green-700 shadow-green-200"><span class="truncate">更新</span></button>
                                </div>
                            ) : (
                                <button onClick={addOrUpdateItem} disabled={!price} class={`flex-1 rounded-lg font-bold text-white flex items-center justify-center gap-1 shadow-sm active:scale-95 transition-all ${!price ? 'bg-gray-300' : 'bg-blue-600 hover:bg-blue-700 shadow-blue-200'}`}>追加</button>
                            )}
                        </div>
                    </div>

                    <style>{`
                        @keyframes fadeIn {
                            from { opacity: 0; transform: translateY(10px); }
                            to { opacity: 1; transform: translateY(0); }
                        }
                        .pb-safe { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
                    `}</style>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
