<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>お買い物サポーター</title>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* モバイルでのタップハイライトを消す */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        /* スクロールバーを隠す */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 数値入力のスピンボタンを消す */
        input[type="number"]::-webkit-outer-spin-button, 
        input[type="number"]::-webkit-inner-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        } 
        input[type="number"] { 
            -moz-appearance:textfield; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen overflow-hidden select-none">

    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVGアイコンコンポーネント
        const Icons = {
            Trash2: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.76.73l.97-.6a2 2 0 0 1 2.33.22l.19.18a2 2 0 0 0 2.82-.24l.22-.38a2 2 0 0 0-.73-2.73l-.97-.6a2 2 0 0 1-.22-2.34l.6-.97a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15-.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
            ShoppingCart: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,
            RefreshCw: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Edit2: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        };

        const App = () => {
            // --- State Management ---
            // 予算
            const [budget, setBudget] = useState(3000);
            const [isBudgetEditing, setIsBudgetEditing] = useState(false);
            
            // 入力フォームの状態
            const [price, setPrice] = useState('');
            const [taxType, setTaxType] = useState('excluded'); // 'excluded' (税抜) or 'included' (税込)
            const [taxRate, setTaxRate] = useState(0.08); // 0.08 or 0.10
            const [quantity, setQuantity] = useState(1);
            const [memo, setMemo] = useState('');
            
            // 編集モードの状態 (nullなら新規追加モード、IDが入っていれば編集モード)
            const [editingId, setEditingId] = useState(null);

            // 商品リスト
            const [items, setItems] = useState([]);

            // アプリ読み込み完了フラグ
            const [isLoaded, setIsLoaded] = useState(false);

            // --- Effects (LocalStorage) ---

            // 初回マウント時にロード
            useEffect(() => {
                const savedData = localStorage.getItem('shopping-app-data-v1');
                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        if (parsed.budget !== undefined) setBudget(parsed.budget);
                        if (parsed.items) setItems(parsed.items);
                    } catch (e) {
                        console.error("データの読み込みに失敗しました", e);
                    }
                }
                setIsLoaded(true);
            }, []);

            // データ変更時に保存
            useEffect(() => {
                if (!isLoaded) return;
                const dataToSave = {
                    budget,
                    items
                };
                localStorage.setItem('shopping-app-data-v1', JSON.stringify(dataToSave));
            }, [budget, items, isLoaded]);

            // --- Logic ---

            // 合計金額の計算（すべての商品の合計）
            const totalAmount = items.reduce((sum, item) => sum + item.subtotal, 0);
            
            // 残金
            const remainingBudget = (budget || 0) - totalAmount;
            const isOverBudget = remainingBudget < 0;

            // 商品追加・更新処理
            const addOrUpdateItem = () => {
                if (!price || isNaN(price)) return; // 価格未入力なら何もしない

                const unitPrice = parseFloat(price);
                let finalPricePerItem = 0;

                // 仕様: 端数処理は切り上げ
                if (taxType === 'excluded') {
                    // 税抜き: 価格 * (1 + 税率) -> 切り上げ
                    finalPricePerItem = Math.ceil(unitPrice * (1 + taxRate));
                } else {
                    // 税込み: そのまま
                    finalPricePerItem = Math.ceil(unitPrice); // 念のため整数化
                }

                const commonData = {
                    memo: memo,
                    inputPrice: unitPrice,
                    taxType: taxType,
                    taxRate: taxType === 'excluded' ? taxRate : null, // 税込なら税率はnull扱い
                    quantity: quantity,
                    subtotal: finalPricePerItem * quantity
                };

                if (editingId) {
                    // --- 更新処理 ---
                    setItems(items.map(item => 
                        item.id === editingId ? { ...item, ...commonData } : item
                    ));
                    setEditingId(null); // 編集モード終了
                } else {
                    // --- 新規追加処理 ---
                    const newItem = {
                        id: Date.now(), // ユニークID
                        ...commonData
                    };
                    setItems([...items, newItem]);
                }

                // フォームリセット
                setPrice('');
                setMemo('');
                setQuantity(1);
            };

            // 編集モード開始処理
            const startEditing = (item) => {
                setEditingId(item.id);
                setPrice(item.inputPrice.toString());
                setMemo(item.memo);
                setTaxType(item.taxType);
                // 税率が存在する場合のみセット、なければデフォルト維持(または前回の値)
                if (item.taxRate) setTaxRate(item.taxRate);
                setQuantity(item.quantity);
            };

            // 編集キャンセル処理
            const cancelEditing = () => {
                setEditingId(null);
                setPrice('');
                setMemo('');
                setQuantity(1);
            };

            // 商品削除処理
            const deleteItem = (id) => {
                // 編集中にそのアイテムを削除した場合、編集モードもキャンセルする
                if (editingId === id) {
                    cancelEditing();
                }
                setItems(items.filter(item => item.id !== id));
            };

            // 全データリセット
            const resetAll = () => {
                if (window.confirm('買い物リストをすべて消去しますか？\n（予算設定は残ります）')) {
                    setItems([]);
                    cancelEditing();
                }
            };

            // 数値フォーマット (カンマ区切り)
            const fmt = (num) => num ? num.toLocaleString() : '0';

            // --- Render Components ---

            if (!isLoaded) return null;

            return (
                <div class="flex flex-col h-full bg-gray-100 max-w-md mx-auto shadow-2xl overflow-hidden relative">
                    
                    {/* Header Area */}
                    <div class={`p-4 transition-colors duration-300 ${isOverBudget ? 'bg-red-600' : 'bg-blue-600'} text-white shadow-md z-10`}>
                        <div class="flex justify-between items-start mb-2">
                            <h1 class="font-bold text-lg flex items-center gap-2">
                                <Icons.ShoppingCart /> 
                                {isOverBudget ? '予算オーバー！' : '買い物中'}
                            </h1>
                            <button onClick={resetAll} class="text-xs bg-white/20 hover:bg-white/30 px-2 py-1 rounded flex items-center gap-1 transition">
                                <Icons.RefreshCw /> リセット
                            </button>
                        </div>

                        <div class="flex justify-between items-end">
                            <div class="flex-1">
                                <div class="text-xs opacity-90 mb-1">現在の合計</div>
                                <div class="text-4xl font-bold tracking-tight">¥{fmt(totalAmount)}</div>
                            </div>
                            
                            <div class="text-right flex flex-col items-end">
                                {/* 予算エリア */}
                                <div class="flex items-center justify-end mb-1 h-10">
                                    <span class="text-sm opacity-90 mr-2">予算</span>
                                    {isBudgetEditing ? (
                                        <input 
                                            type="number"
                                            inputMode="numeric" 
                                            pattern="[0-9]*"
                                            class="w-32 text-gray-800 px-2 py-1 rounded-md text-right text-xl font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-blue-300"
                                            value={budget}
                                            onChange={(e) => setBudget(e.target.value === '' ? '' : parseInt(e.target.value))}
                                            onBlur={() => {
                                                if(budget === '') setBudget(0);
                                                setIsBudgetEditing(false);
                                            }}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') e.target.blur();
                                            }}
                                            autoFocus
                                        />
                                    ) : (
                                        <button 
                                            onClick={() => setIsBudgetEditing(true)} 
                                            class="flex items-center gap-1 text-xl font-bold border-b-2 border-white/50 hover:bg-white/10 hover:border-white px-2 py-0.5 rounded transition-all active:scale-95 bg-white/5"
                                        >
                                            ¥{fmt(budget)}
                                            <span class="opacity-70"><Icons.Edit /></span>
                                        </button>
                                    )}
                                </div>
                                
                                <div class={`text-lg font-bold ${remainingBudget < 0 ? 'text-yellow-300' : 'text-white'}`}>
                                    残り ¥{fmt(remainingBudget)}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* List Area (Scrollable) */}
                    <div class="flex-1 overflow-y-auto p-3 pb-40 no-scrollbar space-y-2">
                        {items.length === 0 ? (
                            <div class="h-full flex flex-col items-center justify-center text-gray-400 opacity-60 mt-10">
                                <Icons.ShoppingCart />
                                <p class="mt-2 text-sm">商品を追加してください</p>
                            </div>
                        ) : (
                            items.map(item => {
                                const isEditingThis = editingId === item.id;
                                return (
                                    <div key={item.id} class={`bg-white p-3 rounded-lg shadow-sm border flex justify-between items-center animate-[fadeIn_0.2s_ease-out] transition-colors ${isEditingThis ? 'border-blue-400 ring-1 ring-blue-100 bg-blue-50' : 'border-gray-100'}`}>
                                        <div class="flex-1">
                                            <div class="flex items-baseline gap-2">
                                                <span class="font-bold text-lg text-gray-800">¥{fmt(item.subtotal)}</span>
                                                <span class="text-xs text-gray-500">
                                                    (@{fmt(Math.ceil(item.subtotal / item.quantity))} × {item.quantity})
                                                </span>
                                            </div>
                                            <div class="text-xs text-gray-500 flex gap-2 mt-1">
                                                <span class="bg-gray-100 px-1.5 py-0.5 rounded">
                                                    {item.taxType === 'included' ? '税込' : `税抜${Math.round(item.taxRate*100)}%`}
                                                </span>
                                                {item.memo && (
                                                    <span class="text-gray-600 truncate max-w-[120px]">
                                                        {item.memo}
                                                    </span>
                                                )}
                                                {isEditingThis && <span class="text-blue-600 font-bold ml-1">編集中...</span>}
                                            </div>
                                        </div>
                                        <div class="flex gap-1">
                                            <button 
                                                onClick={() => startEditing(item)}
                                                class={`p-2 transition-colors active:scale-95 rounded-full ${isEditingThis ? 'text-blue-600 bg-blue-100' : 'text-gray-400 hover:text-blue-500 hover:bg-gray-50'}`}
                                            >
                                                <Icons.Edit2 />
                                            </button>
                                            <button 
                                                onClick={() => deleteItem(item.id)}
                                                class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors active:scale-95"
                                            >
                                                <Icons.Trash2 />
                                            </button>
                                        </div>
                                    </div>
                                );
                            }).reverse()
                        )}
                        {/* Spacer for fixed footer */}
                        <div class="h-20"></div> 
                    </div>

                    {/* Input Area (Fixed Bottom) */}
                    <div class={`border-t p-3 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20 transition-colors duration-300 ${editingId ? 'bg-amber-50 border-amber-200' : 'bg-white border-gray-200'}`}>
                        
                        {/* 編集中の表示 */}
                        {editingId && (
                            <div class="text-xs text-amber-600 font-bold mb-1 flex justify-between">
                                <span>修正モード</span>
                                <button onClick={cancelEditing} class="underline">キャンセル</button>
                            </div>
                        )}

                        {/* 1行目: 値段とメモ */}
                        <div class="flex gap-2 mb-3">
                            <div class="flex-1 relative">
                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 font-bold">¥</span>
                                <input 
                                    type="number" 
                                    inputMode="numeric" 
                                    pattern="[0-9]*"
                                    placeholder="0" 
                                    class="w-full bg-white border border-gray-300 rounded-lg py-3 pl-8 pr-3 text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                    value={price}
                                    onChange={(e) => setPrice(e.target.value)}
                                />
                            </div>
                            <input 
                                type="text" 
                                placeholder="メモ (任意)" 
                                class="w-1/3 bg-white border border-gray-300 rounded-lg px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                value={memo}
                                onChange={(e) => setMemo(e.target.value)}
                            />
                        </div>

                        {/* 2行目: 税設定、個数、追加ボタン */}
                        <div class="flex gap-2 items-stretch h-12">
                            
                            {/* 税設定エリア */}
                            <div class="flex flex-col gap-1 flex-shrink-0 w-28">
                                <div class="flex bg-gray-100 rounded p-0.5 h-full">
                                    <button 
                                        class={`flex-1 text-xs rounded font-bold transition-all ${taxType === 'excluded' ? 'bg-white shadow text-blue-600' : 'text-gray-400'}`}
                                        onClick={() => setTaxType('excluded')}
                                    >
                                        税抜
                                    </button>
                                    <button 
                                        class={`flex-1 text-xs rounded font-bold transition-all ${taxType === 'included' ? 'bg-white shadow text-blue-600' : 'text-gray-400'}`}
                                        onClick={() => setTaxType('included')}
                                    >
                                        税込
                                    </button>
                                </div>
                                {/* 税率選択 (税抜のときのみ有効) */}
                                <div class={`flex bg-gray-100 rounded p-0.5 h-full transition-opacity ${taxType === 'included' ? 'opacity-30 pointer-events-none' : 'opacity-100'}`}>
                                    <button 
                                        class={`flex-1 text-xs rounded font-bold transition-all ${taxRate === 0.08 ? 'bg-white shadow text-green-600' : 'text-gray-400'}`}
                                        onClick={() => setTaxRate(0.08)}
                                    >
                                        8%
                                    </button>
                                    <button 
                                        class={`flex-1 text-xs rounded font-bold transition-all ${taxRate === 0.10 ? 'bg-white shadow text-green-600' : 'text-gray-400'}`}
                                        onClick={() => setTaxRate(0.10)}
                                    >
                                        10%
                                    </button>
                                </div>
                            </div>

                            {/* 個数 */}
                            <div class="flex items-center bg-gray-100 rounded-lg px-1 w-24 justify-between">
                                <button 
                                    class="p-2 text-gray-500 active:text-blue-600 active:scale-90 transition"
                                    onClick={() => setQuantity(Math.max(1, quantity - 1))}
                                >
                                    <Icons.Minus />
                                </button>
                                <span class="font-bold text-lg w-6 text-center">{quantity}</span>
                                <button 
                                    class="p-2 text-gray-500 active:text-blue-600 active:scale-90 transition"
                                    onClick={() => setQuantity(quantity + 1)}
                                >
                                    <Icons.Plus />
                                </button>
                            </div>

                            {/* 追加・更新・キャンセルボタン */}
                            {editingId ? (
                                <div class="flex-1 flex gap-1">
                                    <button 
                                        onClick={cancelEditing}
                                        class="w-12 bg-gray-200 hover:bg-gray-300 rounded-lg text-gray-600 flex items-center justify-center shadow-sm active:scale-95 transition-all"
                                    >
                                        <Icons.X />
                                    </button>
                                    <button 
                                        onClick={addOrUpdateItem}
                                        class="flex-1 rounded-lg font-bold text-white flex items-center justify-center gap-1 shadow-sm active:scale-95 transition-all bg-green-600 hover:bg-green-700 shadow-green-200"
                                    >
                                        <Icons.Check /> 更新
                                    </button>
                                </div>
                            ) : (
                                <button 
                                    onClick={addOrUpdateItem}
                                    disabled={!price}
                                    class={`flex-1 rounded-lg font-bold text-white flex items-center justify-center gap-1 shadow-sm active:scale-95 transition-all
                                        ${!price ? 'bg-gray-300' : 'bg-blue-600 hover:bg-blue-700 shadow-blue-200'}`}
                                >
                                    追加
                                </button>
                            )}
                        </div>
                    </div>

                    <style>{`
                        @keyframes fadeIn {
                            from { opacity: 0; transform: translateY(10px); }
                            to { opacity: 1; transform: translateY(0); }
                        }
                        .pb-safe {
                            padding-bottom: env(safe-area-inset-bottom, 12px);
                        }
                    `}</style>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
